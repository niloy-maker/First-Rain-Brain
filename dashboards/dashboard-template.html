  font-variant-numeric:tabular-nums;
}
.v10-exec-main{flex:1;min-width:0}
.v10-exec-name{
  font-size:12px;font-weight:600;color:var(--text-primary);
  margin-bottom:2px;
}
.v10-exec-stats{
  font-size:10.5px;color:var(--text-tertiary);
  font-variant-numeric:tabular-nums;line-height:1.4;
}

/* ═══ MOBILE RESPONSIVE ═══ */
@media (max-width: 640px){
  .v10-qc-row{gap:4px}
  .v10-qc-q{font-size:9px}
  .v10-qc-val{font-size:10px}

  .v10-dh-grid{grid-template-columns:1fr;gap:10px}
  .v10-dh-pod{padding:12px 14px}
  .v10-dh-title{font-size:13px}
  .v10-dh-metric{font-size:22px}
  .v10-dh-sub{font-size:11px}

  .v10-funnel-row{grid-template-columns:80px 1fr 26px;gap:6px}
  .v10-funnel-label{font-size:10.5px}
  .v10-funnel-count{font-size:10.5px}
}



/* ═══════════════════════════════════════════════════════════
   PROJECTS v11 · Coverage-led indicator + Project Economics pod
═══════════════════════════════════════════════════════════ */

.v11-dh-econ{border-left:4px solid var(--green)}

.v11-cm-dist-label{
  font-size:10px;font-weight:700;letter-spacing:.08em;
  color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;
}
.v11-cm-dist-label strong{
  font-style:normal;font-family:Inter,sans-serif;
  color:var(--text-primary);font-weight:700;
}

.v11-cm-dist{
  display:flex;flex-direction:column;gap:4px;margin-bottom:10px;
}
.v11-cm-row{
  display:grid;grid-template-columns:50px 1fr 22px;gap:8px;
  align-items:center;font-size:11px;
}
.v11-cm-label{
  font-size:10.5px;font-weight:600;color:var(--text-secondary);
  font-variant-numeric:tabular-nums;
}
.v11-cm-bar{
  height:8px;background:var(--v7-panel-bg-2);border-radius:99px;
  border:1px solid var(--border);overflow:hidden;
}
.v11-cm-fill{height:100%;border-radius:99px;opacity:0.85}
.v11-cm-count{
  text-align:right;font-variant-numeric:tabular-nums;
  font-weight:600;color:var(--text-primary);font-size:11px;
}

.v11-cm-summary{
  font-size:11px;line-height:1.55;color:var(--text-secondary);
  padding:8px 10px;background:var(--v7-nested-bg);
  border-radius:var(--r);margin-top:6px;
}
.v11-cm-summary strong{color:var(--text-primary);font-weight:700;font-variant-numeric:tabular-nums}

.v11-econ-divider{
  height:1px;background:var(--border);
  margin:12px 0 10px 0;border:0;border-top:1px dashed var(--border);
}

.v11-econ-stat-row{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.v11-econ-stat{
  display:flex;flex-direction:column;gap:2px;
  padding:8px 10px;background:var(--v7-nested-bg);
  border-radius:var(--r);
}
.v11-econ-l{
  font-size:9px;font-weight:700;letter-spacing:.08em;
  color:var(--text-muted);text-transform:uppercase;
}
.v11-econ-v{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:18px;line-height:1;color:var(--text-primary);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.v11-econ-s{
  font-size:9px;color:var(--text-tertiary);
  font-style:italic;font-family:'Instrument Serif',Georgia,serif;
  line-height:1.3;
}

@media (max-width: 640px){
  .v11-cm-row{grid-template-columns:46px 1fr 22px;gap:6px}
  .v11-cm-label{font-size:10px}
  .v11-cm-count{font-size:10.5px}
  .v11-cm-summary{font-size:10.5px;padding:8px 10px}
  .v11-econ-stat-row{grid-template-columns:1fr;gap:8px}
}

<script type="application/json" id="cfo-data">{{CASHFLOW_JSON}}</script>

<script>
(function() {
  "use strict";

  var themeToggle = document.getElementById("theme-toggle");
  var themeMeta = document.getElementById("theme-meta");
  function setTheme(t) {
    if (t === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
      themeMeta.setAttribute("content", "#0f0f0e");
      themeToggle.textContent = "◑";
    } else {
      document.documentElement.removeAttribute("data-theme");
      themeMeta.setAttribute("content", "#f9f9f8");
      themeToggle.textContent = "◐";
    }
    try { localStorage.setItem("firstrain-theme-alt", t); } catch(e){}
  }
  var saved = "light";
  try { saved = localStorage.getItem("firstrain-theme-alt") || "light"; } catch(e){}
  setTheme(saved);
  themeToggle.onclick = function() {
    var cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
    setTheme(cur === "dark" ? "light" : "dark");
  };

  var raw = document.getElementById("cfo-data").textContent.trim();
  if (raw.indexOf("CASHFLOW_JSON") !== -1 || raw === "" || raw.indexOf("{{") === 0) {
    document.body.innerHTML = '<div class="tpl-warning">'
      + '<div class="tpl-warning-label">First Rain · CFO (Alt)</div>'
      + '<h1>Template — not a rendered dashboard</h1>'
      + '<p>This is the blank template. To see the dashboard, open:</p>'
      + '<ul>'
      + '<li><code>cfo-dashboard-alt-latest.html</code> (rendered by /finance)</li>'
      + '<li><code>dashboard-sample-rendered-alt.html</code> (demo)</li>'
      + '</ul>'
      + '</div>';
    return;
  }

  var DATA;
  try { DATA = JSON.parse(raw); }
  catch(e) {
    document.body.innerHTML = '<div class="tpl-warning"><h1>Data error</h1><p>' + e.message + '</p></div>';
    return;
  }
  var FR = DATA.FR, META = DATA.META;

  function fmt(n) {
    if (n === 0 || n == null) return "₹0";
    var abs = Math.abs(n), sign = n < 0 ? "−" : "";
    if (abs >= 10000000) return sign + "₹" + (abs / 10000000).toFixed(1) + "Cr";
    if (abs >= 100000)   return sign + "₹" + (abs / 100000).toFixed(1) + "L";
    if (abs >= 1000)     return sign + "₹" + (abs / 1000).toFixed(0) + "K";
    return sign + "₹" + abs;
  }
  function fmtSigned(n) { if (n === 0) return "₹0"; return (n > 0 ? "+" : "") + fmt(n); }
  function fmtP(n) {
    if (n === 0 || n == null) return "₹0";
    var abs = Math.abs(n), sign = n < 0 ? "−" : "";
    if (abs >= 10000000) return sign + "₹" + (abs / 10000000).toFixed(2) + "Cr";
    if (abs >= 100000)   return sign + "₹" + (abs / 100000).toFixed(1) + "L";
    if (abs >= 1000)     return sign + "₹" + (abs / 1000).toFixed(0) + "K";
    return sign + "₹" + abs;
  }
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
  function signClass(n) { return n > 0 ? "success" : n < 0 ? "critical" : ""; }

  var runwayMonths = FR.operatingCash / FR.monthlyBurn;
  var overdue30 = (FR.receivables || []).filter(function(r){return r.daysOD>30;}).reduce(function(s,r){return s+r.balance;},0);
  var totalRecv = (FR.receivables || []).reduce(function(s,r){return s+r.balance;},0);
  var overduePct = totalRecv > 0 ? overdue30 / totalRecv : 0;
  var totalPay = (FR.payables || []).reduce(function(s,p){return s+(p.amount||p.balance||0);},0);
  var apArRatio = totalRecv > 0 ? totalPay / totalRecv : 0;
  var statOverdue = (FR.statutory || []).filter(function(s){return s.daysLeft<0||s.daysLeft<5;}).length;
  var criticalStatCount = (FR.statutory || []).filter(function(s){return s.daysLeft<0;}).length;
  var totalStat = (FR.statutory || []).reduce(function(s,x){return s+(x.amount||x.amountPayable||0);},0);

  var dim1 = runwayMonths >= 6 ? 25 : runwayMonths >= 3 ? 22 : runwayMonths >= 2 ? 15 : runwayMonths >= 1 ? 8 : 0;
  var dim2 = overduePct < 0.10 ? 20 : overduePct < 0.20 ? 15 : overduePct < 0.35 ? 10 : 5;
  var dim3 = FR.saltwaterConcentration < 0.30 ? 20 : FR.saltwaterConcentration < 0.50 ? 12 : FR.saltwaterConcentration < 0.70 ? 5 : 2;
  var dim4 = apArRatio < 1.5 ? 15 : apArRatio < 2.5 ? 10 : apArRatio < 4 ? 5 : 0;
  var dim5 = statOverdue === 0 ? 10 : statOverdue === 1 ? 6 : statOverdue === 2 ? 3 : 0;
  var dim6 = FR.secureConcentration < 0.25 ? 10 : FR.secureConcentration < 0.40 ? 6 : FR.secureConcentration < 0.55 ? 3 : 1;

  var healthScore = dim1 + dim2 + dim3 + dim4 + dim5 + dim6;
  var healthGrade = healthScore >= 80 ? "A" : healthScore >= 65 ? "B" : healthScore >= 50 ? "C" : healthScore >= 35 ? "D" : "F";
  var healthLabel = healthScore >= 80 ? "HEALTHY" : healthScore >= 65 ? "WATCH" : healthScore >= 50 ? "STRAINED" : healthScore >= 35 ? "DISTRESSED" : "CRITICAL";
  var healthStatusCls = healthScore >= 65 ? "success" : healthScore >= 50 ? "warning" : "critical";
  var healthGradeCls = "grade-" + healthGrade.toLowerCase();

  var hb = document.getElementById("health-badge");
  var hbt = document.getElementById("health-badge-text");
  hb.className = "health-badge " + healthStatusCls;
  hbt.textContent = "HEALTH " + healthScore + "/100 · " + healthGrade;

  var _genAt = META.generated_at || "";
  var _timeStr = "";
  if (_genAt) {
    try {
      var _d = new Date(_genAt);
      _timeStr = " · " + _d.getHours().toString().padStart(2,"0") + ":" + _d.getMinutes().toString().padStart(2,"0") + " IST";
    } catch(e) {}
  }
  document.getElementById("tb-date").textContent = (META.today || "—") + _timeStr;
  document.getElementById("sb-refresh").textContent = "Last refresh: " + (META.today || "—") + _timeStr;

  var NAV = [
    { id:"overview",    label:"Overview",   icon:"🏠", section:"Home" },
    { id:"cashflow",    label:"Cash Flow",  icon:"📈", section:"Forecast" },
    { id:"receivables", label:"Collect",    icon:"📬", section:"Working capital", count:(FR.receivables||[]).length, crit:(FR.receivables||[]).filter(function(r){return r.daysOD>30;}).length },
    { id:"payables",    label:"Pay",        icon:"📤", section:"Working capital", count:(FR.payables||[]).length, crit:(FR.payables||[]).filter(function(p){return (p.daysLeft??p.daysToDue??0)<0;}).length },
    { id:"statutory",   label:"Statutory",  icon:"🏛", section:"Working capital", count:(FR.statutory||[]).length, crit:criticalStatCount },
    { id:"health",      label:"Health " + healthGrade, icon:"💊", section:"Diagnostics" },
    { id:"projects",   label:"Projects",   icon:"🏗", section:"Diagnostics", count:(FR.projects||[]).length },
    { id:"telegram",    label:"Alerts",     icon:"📱", section:"Diagnostics" },
    { id:"sources",     label:"Data",       icon:"🔌", section:"Diagnostics" }
  ];

  var sbEl = document.getElementById("sb-nav");
  var sections = {};
  NAV.forEach(function(n) { if (!sections[n.section]) sections[n.section] = []; sections[n.section].push(n); });
  var sbHtml = "";
  Object.keys(sections).forEach(function(sec) {
    sbHtml += '<div class="sb-section">' + esc(sec) + '</div>';
    sections[sec].forEach(function(n) {
      var badge = "";
      if (n.crit > 0) badge = '<span class="sb-badge">' + n.crit + '</span>';
      else if (n.count != null) badge = '<span class="sb-badge ok">' + n.count + '</span>';
      sbHtml += '<button class="sb-btn" data-page="' + n.id + '" onclick="window._nav(\'' + n.id + '\')">'
        + '<span class="sb-icon">' + esc(n.icon) + '</span>'
        + esc(n.label)
        + badge
        + '</button>';
    });
  });
  sbEl.innerHTML = sbHtml;

  var mnEl = document.getElementById("mn-scroll");
  var mnHtml = "";
  NAV.forEach(function(n) {
    mnHtml += '<button class="mn-btn" data-page="' + n.id + '" onclick="window._nav(\'' + n.id + '\')">'
      + '<span class="mn-icon">' + esc(n.icon) + '</span>'
      + esc(n.label.replace(/ [A-F]$/, ''))
      + '</button>';
  });
  mnEl.innerHTML = mnHtml;

  window._nav = function(id) {
    document.querySelectorAll(".page").forEach(function(p){p.classList.remove("on");});
    document.querySelectorAll("[data-page]").forEach(function(b){b.classList.remove("on");});
    document.getElementById("page-" + id).classList.add("on");
    document.querySelectorAll('[data-page="'+id+'"]').forEach(function(b){b.classList.add("on");});
    var t = NAV.find(function(x){return x.id===id;});
    document.getElementById("tb-page").textContent = t ? t.label.replace(/ [A-F]$/, '') : id;
    document.getElementById("pages").scrollTo(0,0);
    closeSidebar();
  };

  document.querySelectorAll('[data-page="overview"]').forEach(function(b){b.classList.add("on");});

  window.openSidebar = function(){document.getElementById("sidebar").classList.add("open");document.getElementById("overlay").classList.add("on");};
  window.closeSidebar = function(){document.getElementById("sidebar").classList.remove("open");document.getElementById("overlay").classList.remove("on");};

  var dimensions = [
    { name: "Cash Runway", score: dim1, max: 25,
      description: "How many months you can survive at current burn without any new revenue collection. The single most important early-warning metric.",
      formula: "Operating Cash ÷ Monthly Burn Rate",
      benchmark: "6+ months",
      industry: "Exhibition builders (global): 4-6 months. Top quartile (Freeman, GL Events): 6-9 months. Project-based SMEs: 2-3 months typical, 6+ recommended.",
      actual: runwayMonths.toFixed(1) + " months (" + fmt(FR.operatingCash) + " operating ÷ " + fmt(FR.monthlyBurn) + " monthly burn)",
      gap: runwayMonths < 6 ? (6 - runwayMonths).toFixed(1) + " months below target. Need " + fmt((6 - runwayMonths) * FR.monthlyBurn) + " additional liquidity." : "Within target",
      source: "Industry: Freeman 10-K, GL Events annual report. Framework: Roper Technologies capital discipline — maintain 6-month operating buffer minimum." },
    { name: "Receivables Discipline", score: dim2, max: 20,
      description: "Collection efficiency. High ratio means either lax chase discipline, weak client mix, or bad credit decisions. All three kill cash flow.",
      formula: "Σ Receivables overdue >30 days ÷ Total Receivables",
      benchmark: "<10% overdue >30d",
      industry: "Construction & project services (India): 15-25% overdue is typical. Best-in-class: <10% (L&T ~8%, Afcons ~12%).",
      actual: (overduePct * 100).toFixed(1) + "% of AR overdue >30d (" + fmt(overdue30) + " of " + fmt(totalRecv) + ")",
      gap: overduePct > 0.10 ? ((overduePct - 0.10) * 100).toFixed(0) + " pts above target. Chase overdue clients + drop below." : "Within target",
      source: "CRISIL India Construction Sector Report 2024. ReadyRatios industry benchmarks." },
    { name: "Vendor Concentration", score: dim3, max: 20,
      description: "Dependency risk. If your top fabricator tightens credit, delays a project, or walks — how exposed are you? Tightly correlates with negotiation leverage.",
      formula: "Largest vendor's share of total Cost of Production (CP)",
      benchmark: "<30% single vendor",
      industry: "Exhibition build (global): 25-40% typical. Best-in-class: 15-25% with 3+ qualified partners. Ceiling before concentration risk: 30%.",

    var sheetSales = proj.reduce(function(s,p){return s+p.sales;},0);
    var closedContrib = proj.reduce(function(s,p){return s+p.contribution;},0);

    var active = pipeline.filter(function(d){return d.bucket !== 'junk' && d.bucket !== 'lost' && d.bucket !== 'won';});
    var activeWt = active.reduce(function(s,d){return s+(d.weighted||0);},0);
    var activeRaw = active.reduce(function(s,d){return s+(d.amount||0);},0);

    // Bigin Won deals not yet in Projects sheet — Sonal/Chinmay still need to
    // add CP rows. Surfaced separately so YTD reflects ALL signed revenue.
    // Match: take first 5 chars of sheet project name to tolerate small
    // spelling differences (e.g. "Vitafoods" vs "Vitafood").
    var sheetShowPrefix = proj.map(function(p){
      var first = (p.project||'').toLowerCase().split(' ')[0];
      return first ? first.substring(0, Math.min(5, first.length)) : '';
    }).filter(Boolean);
    var biginWon = pipeline.filter(function(d){return d.bucket==='won';});
    var biginWonNotInSheet = biginWon.filter(function(d){
      var dn = (d.deal||'').toLowerCase();
      return !sheetShowPrefix.some(function(pn){return pn && dn.indexOf(pn) !== -1;});
    });
    var wonExtraTotal = biginWonNotInSheet.reduce(function(s,d){return s+(d.amount||0);},0);
    var wonExtraCount = biginWonNotInSheet.length;

    // YTD = sheet projects + Bigin Won deals not in sheet (full signed revenue)
    var closedSales = sheetSales + wonExtraTotal;
    var totalClosedCount = proj.length + wonExtraCount;
    var avgTicket = totalClosedCount > 0 ? closedSales / totalClosedCount : 0;
    // CM only valid for projects with CP data (Sonal sheet entries)
    var closedCM = sheetSales > 0 ? closedContrib/sheetSales*100 : 0;
    var indiaProj = proj.filter(function(p){return p.region==='India';});
    var indiaAvg = indiaProj.length > 0 ? indiaProj.reduce(function(s,p){return s+p.sales;},0) / indiaProj.length : 0;

    var SECURE_ACCT = '4996576000000487001';
    function isSecure(name){ return (name || '').toLowerCase().indexOf('secure meters') === 0; }
    var secureClosed = proj.filter(function(p){return isSecure(p.company);}).reduce(function(s,p){return s+p.sales;},0);

    function svgTrajectory(steps, currentYTD) {
      var w = 700, h = 200, padL = 55, padR = 55, padT = 40, padB = 50;

      var stepX = (w - padL - padR) / (steps.length - 1);

      var areaPath = 'M ' + x(0) + ' ' + (h-padB);
      steps.forEach(function(s,i){ areaPath += ' L ' + x(i) + ' ' + y(s.val); });
      areaPath += ' L ' + x(steps.length-1) + ' ' + (h-padB) + ' Z';
      var linePath = '';
      steps.forEach(function(s,i){ linePath += (i===0?'M ':' L ') + x(i) + ' ' + y(s.val); });
      var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" class="v7-traj-svg" xmlns="http://www.w3.org/2000/svg">';

      svg += '<path d="' + areaPath + '" fill="url(#v8TrajGrad)"/>';

      steps.forEach(function(s,i){

        var rad = isTarget ? 8 : isCurrent ? 7 : 5;

        var valY = cy - rad - 12;

      });

        svg += '<line x1="' + (padL + 5) + '" y1="' + ytdY + '" x2="' + (w - padR - 5) + '" y2="' + ytdY + '" stroke="' + COLOR.red + '" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>';
        svg += '<rect x="' + (padL+8) + '" y="' + (ytdY-10) + '" width="78" height="18" rx="4" fill="' + COLOR.red + '"/>';
        svg += '<text x="' + (padL+47) + '" y="' + (ytdY+4) + '" text-anchor="middle" font-size="10" font-weight="700" fill="white" letter-spacing="0.8">YTD ' + fmt(currentYTD) + '</text>';
      }
      svg += '</svg>';
      return svg;
    }

    function svgDonut(segments, totalLabel) {
      var w = 360, h = 220, cx = 110, cy = 110, r = 82, rIn = 52;
      var total = segments.reduce(function(s,seg){return s+seg.val;},0);
      var startAngle = -Math.PI / 2;
      var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" class="v7-donut" xmlns="http://www.w3.org/2000/svg">';
      segments.forEach(function(seg,i){
        if (seg.val <= 0) return;
        var angle = (seg.val / total) * Math.PI * 2;
        var endAngle = startAngle + angle;
        var x1 = cx + Math.cos(startAngle) * r, y1 = cy + Math.sin(startAngle) * r;
        var x2 = cx + Math.cos(endAngle) * r, y2 = cy + Math.sin(endAngle) * r;

    var clientForward = {};
    /* Normalize duplicate account name variants (e.g. "Bechem" + "Bechem Lubricants") */
    function normalizeName(n) {
      if (!n) return n;
      var lower = n.toLowerCase().trim();
      /* Strip common suffixes for matching */
      lower = lower.replace(/\s+(india|systems|pvt|private|limited|ltd|inc|llc|co\.?|corporation|corp)\.?$/g, '');
      lower = lower.replace(/\s+(india|systems|pvt|private|limited|ltd|inc|llc|co\.?|corporation|corp)\.?\s/g, ' ');

    var QUARTER_TARGET = 22500000; /* ₹9Cr / 4 */
    var qc = {Q1:0, Q2:0, Q3:0, Q4:0};

    /* ════════ DEMOTED ════════ */
    pjHtml += '<div class="v7-demote-header">Supporting <em>data</em></div>';
    pjHtml += '<div class="v7-demote-note">Operational items (CK shadowing, fabricator decisions, lead cleanup) live in the morning briefing and Sonal\'s task list — not here.</div>';

    pjHtml += '<div class="v7-demote-block">';
    pjHtml += '<div class="v7-demote-title">Closed projects · FY26-27 YTD</div>';
    pjHtml += '<div class="v7-muted"><table class="proj-table">'
      + '<thead><tr>'
      + '<th>Code</th><th>Client</th><th>Region</th><th>Industry</th><th>Exec</th>'
      + '<th class="num">Sqm</th><th class="num">SP</th><th class="num">CP</th><th class="num">SP/sqm</th><th class="num">CP/sqm</th><th class="num">Margin</th><th>CM%</th>'
      + '</tr></thead><tbody>';
    proj.forEach(function(p){
      var cmCls = p.contributionPct >= 50 ? 'good' : p.contributionPct >= 30 ? 'mid' : 'bad';
      pjHtml += '<tr>'
        + '<td><span class="proj-code">' + esc(p.projectNo) + '</span></td>'
        + '<td>' + esc(p.company) + (p.isRepeat ? ' <span class="proj-repeat-dot">●</span>' : '') + '</td>'
        + '<td>' + esc(p.region) + '</td>'
        + '<td style="font-size:11px;color:var(--text-tertiary)">' + esc(p.industry) + '</td>'
        + '<td><span class="proj-exec-tag">' + esc(p.exec) + '</span></td>'
        + '<td class="num">' + p.sizeSqm + '</td>'
        + '<td class="num">' + fmt(p.sales) + '</td>'
        + '<td class="num">' + fmt(p.variableCost) + '</td>'
        + '<td class="num" style="color:var(--text-secondary)">' + (p.sizeSqm > 0 ? fmt(p.sales / p.sizeSqm) : '—') + '</td>'
        + '<td class="num" style="color:var(--text-secondary)">' + (p.sizeSqm > 0 ? fmt(p.variableCost / p.sizeSqm) : '—') + '</td>'
        + '<td class="num">' + fmt(p.contribution) + '</td>'
        + '<td><span class="proj-cm-pill ' + cmCls + '">' + p.contributionPct + '%</span></td>'
        + '</tr>';
    });
    pjHtml += '</tbody></table></div></div>';

    document.getElementById("page-projects").innerHTML = pjHtml;
  }






  /* TELEGRAM */
  document.getElementById("page-telegram").innerHTML =
    '<div class="page-title">Daily <em>briefing</em></div>'
    + '<div class="page-sub">Telegram summary sent 08:00 IST</div>'
    + '<div class="telegram-banner">' + esc(FR.telegramBriefing || "(No briefing)") + '</div>';

  /* SOURCES */
  var srcHtml = '<div class="page-title">Data <em>sources</em></div>'
    + '<div class="page-sub">Connection status · last accessed</div>';
  (META.sources || []).forEach(function(s) {
    var st = s.status || (s.ok ? "ok" : "failed");
    var indCls = st === "stale" ? "stale" : (s.ok ? "ok" : "err");
    var badgeLabel = st === "ok" ? "Live" : st === "stale" ? "Stale" : "Failed";
    var tsLine = s.lastAccessedFmt && s.lastAccessedFmt !== "—"
      ? '<div class="src-ts">'
        + '<span class="src-ts-badge ' + st + '">' + esc(badgeLabel) + '</span>'
        + esc(s.lastAccessedFmt)
        + '</div>'
      : '';
    srcHtml += '<div class="src-card">'
      + '<span class="src-indicator ' + indCls + '"></span>'
      + '<div class="src-text">'
      +   '<div class="src-name">' + esc(s.name) + '</div>'
      +   '<div class="src-detail">' + esc(s.detail) + '</div>'
      +   tsLine
      + '</div>'
      + '</div>';
  });
  srcHtml += '<div style="margin-top:16px;padding:14px 16px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--r);font-size:11px;color:var(--text-tertiary);line-height:1.6">'
    + '<div style="color:var(--accent);font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:600">Refresh info</div>'
    + 'Last: ' + esc(META.lastRefresh || "—") + '<br>'
    + 'Auto-regenerated every /finance run<br>'
    + 'Bookmark: cfo-dashboard-alt-latest.html'
    + '</div>';
  document.getElementById("page-sources").innerHTML = srcHtml;

})();
</script>

</body>
</html>
