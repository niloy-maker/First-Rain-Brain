  .v10-qc-row{gap:4px}
  .v10-qc-q{font-size:9px}
  .v10-qc-val{font-size:10px}

  .v10-dh-grid{grid-template-columns:1fr;gap:10px}
  .v10-dh-pod{padding:12px 14px}
  .v10-dh-title{font-size:13px}
  .v10-dh-metric{font-size:22px}
  .v10-dh-sub{font-size:11px}

  .v10-funnel-row{grid-template-columns:80px 1fr 26px;gap:6px}
  .v10-funnel-label{font-size:10.5px}
  .v10-funnel-count{font-size:10.5px}
}

   PROJECTS v11 · Coverage-led indicator + Project Economics pod
═══════════════════════════════════════════════════════════ */

.v11-dh-econ{border-left:4px solid var(--green)}

}

}

.v11-cm-dist{

}
.v11-cm-row{
  display:grid;grid-template-columns:50px 1fr 22px;gap:8px;
  align-items:center;font-size:11px;
}
.v11-cm-label{
  font-size:10.5px;font-weight:600;color:var(--text-secondary);
  font-variant-numeric:tabular-nums;
}
.v11-cm-bar{
  height:8px;background:var(--v7-panel-bg-2);border-radius:99px;
  border:1px solid var(--border);overflow:hidden;
}
.v11-cm-fill{height:100%;border-radius:99px;opacity:0.85}
.v11-cm-count{
  text-align:right;font-variant-numeric:tabular-nums;
  font-weight:600;color:var(--text-primary);font-size:11px;
}

.v11-cm-summary{
  font-size:11px;line-height:1.55;color:var(--text-secondary);
  padding:8px 10px;background:var(--v7-nested-bg);
  border-radius:var(--r);margin-top:6px;
}
.v11-cm-summary strong{color:var(--text-primary);font-weight:700;font-variant-numeric:tabular-nums}

.v11-econ-divider{
  height:1px;background:var(--border);
  margin:12px 0 10px 0;border:0;border-top:1px dashed var(--border);
}

.v11-econ-stat-row{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.v11-econ-stat{

  padding:8px 10px;background:var(--v7-nested-bg);
  border-radius:var(--r);

.v11-econ-l{
  font-size:9px;font-weight:700;letter-spacing:.08em;
  color:var(--text-muted);text-transform:uppercase;
}
.v11-econ-v{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:18px;line-height:1;color:var(--text-primary);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.v11-econ-s{
  font-size:9px;color:var(--text-tertiary);
  font-style:italic;font-family:'Instrument Serif',Georgia,serif;
  line-height:1.3;
}

@media (max-width: 640px){
  .v11-cm-row{grid-template-columns:46px 1fr 22px;gap:6px}

    var closedContrib = proj.reduce(function(s,p){return s+p.contribution;},0);

    var active = pipeline.filter(function(d){return d.bucket !== 'junk' && d.bucket !== 'lost' && d.bucket !== 'won';});

    // Match: take first 5 chars of sheet project name to tolerate small
    // spelling differences (e.g. "Vitafoods" vs "Vitafood").
    var sheetShowPrefix = proj.map(function(p){
      var first = (p.project||'').toLowerCase().split(' ')[0];
      return first ? first.substring(0, Math.min(5, first.length)) : '';
    }).filter(Boolean);
    var biginWon = pipeline.filter(function(d){return d.bucket==='won';});
    var biginWonNotInSheet = biginWon.filter(function(d){
      var dn = (d.deal||'').toLowerCase();
      return !sheetShowPrefix.some(function(pn){return pn && dn.indexOf(pn) !== -1;});
    });
    var wonExtraTotal = biginWonNotInSheet.reduce(function(s,d){return s+(d.amount||0);},0);
    var wonExtraCount = biginWonNotInSheet.length;

    // YTD = sheet projects + Bigin Won deals not in sheet (full signed revenue)
    var closedSales = sheetSales + wonExtraTotal;
    var totalClosedCount = proj.length + wonExtraCount;
    var avgTicket = totalClosedCount > 0 ? closedSales / totalClosedCount : 0;
    // CM only valid for projects with CP data (Sonal sheet entries)
    var closedCM = sheetSales > 0 ? closedContrib/sheetSales*100 : 0;
    var indiaProj = proj.filter(function(p){return p.region==='India';});
    var indiaAvg = indiaProj.length > 0 ? indiaProj.reduce(function(s,p){return s+p.sales;},0) / indiaProj.length : 0;

    var SECURE_ACCT = '4996576000000487001';
    function isSecure(name){ return (name || '').toLowerCase().indexOf('secure meters') === 0; }
    var secureClosed = proj.filter(function(p){return isSecure(p.company);}).reduce(function(s,p){return s+p.sales;},0);
    var securePipeWt = active.filter(function(d){return d.account===SECURE_ACCT;}).reduce(function(s,d){return s+(d.weighted||0);},0);
    // Reuse the same prefix-match dedup as biginWonNotInSheet above
    function inSheet(d){
      var dn = (d.deal||'').toLowerCase();
      return sheetShowPrefix.some(function(pn){return pn && dn.indexOf(pn) !== -1;});
    }
    var secureWonExtra = pipeline.filter(function(d){
      return d.bucket==='won' && d.account===SECURE_ACCT && !inSheet(d);
    }).reduce(function(s,d){return s + (d.amount || 0);}, 0);
    var totalForward = closedSales + activeWt;
    var secureSharePct = totalForward > 0 ? (secureClosed + secureWonExtra + securePipeWt)/totalForward*100 : 0;

    var intlClosed = proj.filter(function(p){return p.region!=='India';}).reduce(function(s,p){return s+p.sales;},0);
    var intlPipeWt = active.filter(function(d){return d.region!=='India';}).reduce(function(s,d){return s+(d.weighted||0);},0);
    // Add Bigin Won non-India deals not in Projects sheet (e.g., Housing/Installer UK)
    var intlWonExtra = pipeline.filter(function(d){
      return d.bucket==='won' && d.region !== 'India' && !inSheet(d);
    }).reduce(function(s,d){return s + (d.amount || 0);}, 0);
    var intlSharePct = totalForward > 0 ? (intlClosed + intlWonExtra + intlPipeWt)/totalForward*100 : 0;
    var sub15Count = proj.filter(function(p){return p.sales < 1500000;}).length;

    var execPipe = {};
    ['CK','SP','DS','ND'].forEach(function(e){ execPipe[e] = {count:0, weighted:0}; });
    active.forEach(function(d){
      var e = d.exec;
      if (!execPipe[e]) execPipe[e] = {count:0, weighted:0};
      execPipe[e].count++;
      execPipe[e].weighted += d.weighted || 0;
    });

    var fy27TargetLow = 90000000, fy27TargetHigh = 100000000;
    var fy27GapLow = fy27TargetLow - closedSales;
    var fy27GapHigh = fy27TargetHigh - closedSales;
    var fy27CoverageWt = activeWt / fy27GapLow * 100;
    var fy27CoverageRaw = activeRaw / fy27GapLow * 100;

    /* ─── Enterprise account roll-up (by account_name from resolved) ─── */

    function svgTrajectory(steps, currentYTD) {
      var w = 700, h = 200, padL = 55, padR = 55, padT = 40, padB = 50;
      var maxV = Math.max.apply(null, steps.map(function(s){return s.val;}));
      var stepX = (w - padL - padR) / (steps.length - 1);
      function x(i){return padL + i*stepX;}
      function y(v){return padT + (1 - v/maxV) * (h - padT - padB);}
      var areaPath = 'M ' + x(0) + ' ' + (h-padB);
      steps.forEach(function(s,i){ areaPath += ' L ' + x(i) + ' ' + y(s.val); });
      areaPath += ' L ' + x(steps.length-1) + ' ' + (h-padB) + ' Z';
      var linePath = '';
      steps.forEach(function(s,i){ linePath += (i===0?'M ':' L ') + x(i) + ' ' + y(s.val); });
      var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" class="v7-traj-svg" xmlns="http://www.w3.org/2000/svg">';
      svg += '<defs><linearGradient id="v8TrajGrad" x1="0" x2="0" y1="0" y2="1">'

      svg += '<line x1="' + padL + '" y1="' + (h-padB) + '" x2="' + (w-padR) + '" y2="' + (h-padB) + '" stroke="' + COLOR.divider + '" stroke-width="1"/>';
      svg += '<path d="' + areaPath + '" fill="url(#v8TrajGrad)"/>';
      svg += '<path d="' + linePath + '" stroke="' + COLOR.accent + '" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
      steps.forEach(function(s,i){
        var cx = x(i), cy = y(s.val);
        var isTarget = i === steps.length - 1;
        var isCurrent = i === 1;
        var rad = isTarget ? 8 : isCurrent ? 7 : 5;
        var fillColor = isTarget ? COLOR.green : isCurrent ? COLOR.accent : COLOR.textTertiary;
        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (rad+3) + '" fill="' + COLOR.chartBg + '"/>';
        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + rad + '" fill="' + fillColor + '"/>';
        svg += '<text x="' + cx + '" y="' + (h-padB+22) + '" text-anchor="middle" font-size="12" font-weight="700" fill="' + COLOR.textMuted + '" letter-spacing="1">' + s.year + '</text>';
        var valY = cy - rad - 12;
        var valColor = isTarget ? COLOR.green : isCurrent ? COLOR.accent : COLOR.textPrimary;
        svg += '<text x="' + cx + '" y="' + valY + '" text-anchor="middle" font-size="15" font-style="italic" font-family="Instrument Serif, Georgia, serif" fill="' + valColor + '">' + s.label + '</text>';
      });
      if (currentYTD > 0) {
        var ytdY = y(currentYTD);
        svg += '<line x1="' + (padL + 5) + '" y1="' + ytdY + '" x2="' + (w - padR - 5) + '" y2="' + ytdY + '" stroke="' + COLOR.red + '" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>';
        svg += '<rect x="' + (padL+8) + '" y="' + (ytdY-10) + '" width="78" height="18" rx="4" fill="' + COLOR.red + '"/>';
        svg += '<text x="' + (padL+47) + '" y="' + (ytdY+4) + '" text-anchor="middle" font-size="10" font-weight="700" fill="white" letter-spacing="0.8">YTD ' + fmt(currentYTD) + '</text>';
      }
      svg += '</svg>';
      return svg;
    }

    function svgDonut(segments, totalLabel) {
      var w = 360, h = 220, cx = 110, cy = 110, r = 82, rIn = 52;
      var total = segments.reduce(function(s,seg){return s+seg.val;},0);
      var startAngle = -Math.PI / 2;
      var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" class="v7-donut" xmlns="http://www.w3.org/2000/svg">';
      segments.forEach(function(seg,i){
        if (seg.val <= 0) return;
        var angle = (seg.val / total) * Math.PI * 2;
        var endAngle = startAngle + angle;
        var x1 = cx + Math.cos(startAngle) * r, y1 = cy + Math.sin(startAngle) * r;
        var x2 = cx + Math.cos(endAngle) * r, y2 = cy + Math.sin(endAngle) * r;
        var x3 = cx + Math.cos(endAngle) * rIn, y3 = cy + Math.sin(endAngle) * rIn;
        var x4 = cx + Math.cos(startAngle) * rIn, y4 = cy + Math.sin(startAngle) * rIn;
        var largeArc = angle > Math.PI ? 1 : 0;
        var path = 'M ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + x2 + ' ' + y2 + ' L ' + x3 + ' ' + y3 + ' A ' + rIn + ' ' + rIn + ' 0 ' + largeArc + ' 0 ' + x4 + ' ' + y4 + ' Z';

    var clientForward = {};

    function normalizeName(n) {

      +   '</div>'
      + '</div>'
      + '</div>';

    /* ════════ REGION STACKED BAR ════════ */
    pjHtml += '<div class="v7-section-title">Forward book by region · <em>where the next ₹ comes from</em></div>';
    var regionColors = {
      'India': 'var(--v7-region-india)', 'Europe': 'var(--v7-region-europe)', 'UK': 'var(--v7-region-uk)',
      'South East Asia': 'var(--v7-region-sea)', 'Middle East': 'var(--v7-region-me)',
      'Americas': 'var(--v7-region-americas)', 'Rest of the World': 'var(--v7-region-row)'

    var regionSummary = {};
    allRegions.forEach(function(r){ regionSummary[r] = {closed:0, pipeWt:0, count:0}; });
    proj.forEach(function(p){ if (regionSummary[p.region]) { regionSummary[p.region].closed += p.sales; regionSummary[p.region].count++; }});
    active.forEach(function(d){ if (regionSummary[d.region]) regionSummary[d.region].pipeWt += d.weighted || 0; });
    var regionSegs = allRegions.map(function(r){
      var s = regionSummary[r] || {closed:0,pipeWt:0};
      return {label: r, val: s.closed + s.pipeWt, color: regionColors[r] || 'var(--text-muted)'};
    }).filter(function(s){return s.val > 0;}).sort(function(a,b){return b.val - a.val;});
    pjHtml += '<div class="v7-context-card v7-context-card-wide">'
      + '<div class="v7-stacked-wrap">' + svgStackedBar(regionSegs) + '</div>'
      + '<div class="v7-stacked-summary">Total forward book <strong>' + fmt(Math.round(totalForward)) + '</strong> · ' + regionSegs.length + ' regions active · ' + (allRegions.length - regionSegs.length) + ' absent</div>'
      + '</div>';

    /* ════════ WEEKLY MOMENTUM ════════ */
    pjHtml += '<div class="v7-section-title">Momentum · <em>what\'s moving</em></div>';
    pjHtml += '<div class="v8-mom-note">Derived from live Bigin state. Full week-over-week diff starts once <strong>/finance</strong> begins nightly snapshots.</div>';
    pjHtml += '<div class="v8-mom-grid">';

    /* Pod 1: Imminent — deals closing in next 4 weeks */
    pjHtml += '<div class="v8-mom-pod v8-mom-imminent">'
      + '<div class="v8-mom-pod-head">'
      +   '<div class="v8-mom-pod-title">Imminent · next 35 days</div>'
      +   '<div class="v8-mom-pod-count">' + imminent.length + '</div>'
      + '</div>'
      + '<div class="v8-mom-pod-body">';
    if (imminent.length === 0) {
      pjHtml += '<div class="v8-mom-empty">No deals with close dates in the next 5 weeks.</div>';
    } else {
      imminent.slice(0,5).forEach(function(d){
        var daysLabel = d.daysToClose < 0 ? (-d.daysToClose) + 'd overdue' : d.daysToClose === 0 ? 'today' : 'in ' + d.daysToClose + 'd';
        var dayCls = d.daysToClose < 0 ? 'overdue' : d.daysToClose <= 7 ? 'urgent' : 'soon';
        pjHtml += '<div class="v8-mom-row">'
          + '<div class="v8-mom-row-main">'
          +   '<div class="v8-mom-row-name">' + esc(d.account_name || 'Unknown') + '</div>'
          +   '<div class="v8-mom-row-meta">' + esc(d.deal.replace(/^[A-Z]{2}\s*-\s*/,'').substring(0,50)) + '</div>'
          + '</div>'
          + '<div class="v8-mom-row-side">'
          +   '<div class="v8-mom-row-amt">' + (d.amount ? fmt(d.amount) : '—') + '</div>'
          +   '<div class="v8-mom-row-days ' + dayCls + '">' + daysLabel + '</div>'
          + '</div>'
          + '</div>';
      });
      if (imminent.length > 5) {
        pjHtml += '<div class="v8-mom-more">+' + (imminent.length - 5) + ' more in next 5 weeks</div>';
      }
    }
    pjHtml += '</div></div>';

    /* Pod 2: Slipping — past close date, still open */
    pjHtml += '<div class="v8-mom-pod v8-mom-slipping">'
      + '<div class="v8-mom-pod-head">'
      +   '<div class="v8-mom-pod-title">Slipping · past close date</div>'
      +   '<div class="v8-mom-pod-count">' + slipping.length + '</div>'
      + '</div>'
      + '<div class="v8-mom-pod-body">';

      pjHtml += '<div class="v8-mom-empty v8-mom-clean">Clean · no overdue deals</div>';
    } else {
      slipping.slice(0,5).forEach(function(d){
        pjHtml += '<div class="v8-mom-row">'
          + '<div class="v8-mom-row-main">'
          +   '<div class="v8-mom-row-name">' + esc(d.account_name || 'Unknown') + '</div>'
          +   '<div class="v8-mom-row-meta">' + esc(d.deal.replace(/^[A-Z]{2}\s*-\s*/,'').substring(0,50)) + ' · ' + esc(d.stage) + '</div>'
          + '</div>'
          + '<div class="v8-mom-row-side">'
          +   '<div class="v8-mom-row-amt">' + (d.amount ? fmt(d.amount) : '—') + '</div>'
          +   '<div class="v8-mom-row-days overdue">' + d.daysOverdue + 'd overdue</div>'

    /* Pod 3: Stage distribution — funnel shape */

      + '<div class="v8-mom-pod-head">'
      +   '<div class="v8-mom-pod-title">Funnel shape</div>'
      +   '<div class="v8-mom-pod-count">' + pipeline.length + '</div>'
      + '</div>'
      + '<div class="v8-mom-pod-body">';
    var funnelOrder = ['New Leads & Enquiries','Not Qualified','BBANNTI Qualified','Design','Price Quote','Existing Confirmed','Closed Won','Closed Lost'];
    var maxStageCount = Math.max.apply(null, funnelOrder.map(function(s){return stageCounts[s] || 0;}));
    funnelOrder.forEach(function(s){
      var c = stageCounts[s] || 0;
      if (c === 0) return;
      var barPct = maxStageCount > 0 ? (c/maxStageCount * 100) : 0;
      var cls = s === 'Closed Won' ? 'good' : s === 'Closed Lost' ? 'bad' : s === 'Not Qualified' ? 'mute' : 'mid';
      pjHtml += '<div class="v8-funnel-row">'
        + '<div class="v8-funnel-label">' + esc(s) + '</div>'

        + '<div class="v8-funnel-count">' + c + '</div>'

    pjHtml += '</div></div>';

    pjHtml += '</div>';  /* end v8-mom-grid */

    /* Recent wins strip */
    pjHtml += '<div class="v8-wins-strip">'
      + '<div class="v8-wins-head">✓ Recent wins · ' + recentWins.length + ' deals · ' + fmt(recentWinsVal) + '</div>'

        + '</div>';

    pjHtml += '</div></div>';

    /* ════════ DEAL HEALTH · v10 · sales engine view ════════ */
    pjHtml += '<div class="v7-section-title">Deal health · <em>the sales engine</em></div>';

    /* Conversion data — terminal deal outcomes */
    var termWon = pipeline.filter(function(d){return d.bucket === 'won';}).length;
    var termLost = pipeline.filter(function(d){return d.bucket === 'lost';}).length;
    var termJunk = pipeline.filter(function(d){return d.bucket === 'junk';}).length;
    var winRateInclJunk = (termWon + termLost + termJunk) > 0 ? termWon / (termWon + termLost + termJunk) * 100 : 0;
    var winRateExclJunk = (termWon + termLost) > 0 ? termWon / (termWon + termLost) * 100 : 0;

    /* Active funnel — non-terminal stages */
    var activeStages = ['New Leads & Enquiries','BBANNTI Qualified','Design','Price Quote','Existing Confirmed'];
    var activeStageCounts = {};
    activeStages.forEach(function(s){activeStageCounts[s] = 0;});
    active.forEach(function(d){
      if (activeStageCounts.hasOwnProperty(d.stage)) activeStageCounts[d.stage]++;
    });
    var activeTotal = activeStages.reduce(function(sum, s){return sum + activeStageCounts[s];}, 0);

    /* Stuck deals — active deals past their expected close date */
    var stuck = [];
    active.forEach(function(d){
      var cd = parseDate(d.close);
      if (cd && cd < today) {
        stuck.push(Object.assign({}, d, {daysOverdue: Math.floor((today - cd) / (1000*60*60*24))}));
      }
    });
    stuck.sort(function(a,b){return b.daysOverdue - a.daysOverdue;});

    /* Exec performance — count, weighted, wins */
    var execPerf = {};
    ['CK','SP','DS','ND'].forEach(function(e){ execPerf[e] = {active:0, weighted:0, won:0}; });
    active.forEach(function(d){ if (execPerf[d.exec]) { execPerf[d.exec].active++; execPerf[d.exec].weighted += d.weighted || 0; }});
    /* Closed wins from projects (the 7 Sheet-logged) */
    proj.forEach(function(p){ if (execPerf[p.exec]) execPerf[p.exec].won++; });
    /* Plus Bigin Won */
    pipeline.filter(function(d){return d.bucket === 'won';}).forEach(function(d){
      if (execPerf[d.exec]) execPerf[d.exec].won++;
    });

    pjHtml += '<div class="v10-dh-grid">';

    /* Column 1: Conversion / funnel shape */
    pjHtml += '<div class="v10-dh-pod v10-dh-conv">'
      + '<div class="v10-dh-head">'
      +   '<div class="v10-dh-title">Conversion</div>'
      +   '<div class="v10-dh-metric">' + winRateExclJunk.toFixed(0) + '%</div>'
      + '</div>'
      + '<div class="v10-dh-sub">win rate on qualified deals · ' + termWon + ' won · ' + termLost + ' lost</div>'
      + '<div class="v10-dh-body">';

    /* Shrinking active funnel */
    var maxActiveCount = Math.max.apply(null, activeStages.map(function(s){return activeStageCounts[s];}));
    activeStages.forEach(function(s,i){
      var c = activeStageCounts[s];
      var shortName = s.replace('& Enquiries','').replace('BBANNTI ','').replace('Existing ','').trim();
      var widthPct = maxActiveCount > 0 ? (c / maxActiveCount * 100) : 0;
      pjHtml += '<div class="v10-funnel-row">'
        + '<div class="v10-funnel-label">' + esc(shortName) + '</div>'
        + '<div class="v10-funnel-bar-wrap">'
        +   '<div class="v10-funnel-bar-fill" style="width:' + widthPct + '%"></div>'
        + '</div>'
        + '<div class="v10-funnel-count">' + c + '</div>'

    pjHtml += '<div class="v10-dh-footnote">Rate excl. unqualified: <strong>' + winRateExclJunk.toFixed(0) + '%</strong> · incl. unqualified: ' + winRateInclJunk.toFixed(0) + '% · active: ' + activeTotal + '</div>';
    pjHtml += '</div></div>';

    /* Column 2: Stuck deals */
    pjHtml += '<div class="v10-dh-pod v10-dh-stuck">'
      + '<div class="v10-dh-head">'
      +   '<div class="v10-dh-title">Stuck · past close date</div>'
      +   '<div class="v10-dh-metric">' + stuck.length + '</div>'

      + '<div class="v10-dh-sub">deals that should have closed already</div>'

          + '</div>'
          + '<div class="v10-stuck-days">' + d.daysOverdue + 'd</div>'
          + '</div>';

      if (stuck.length > 4) {
        pjHtml += '<div class="v10-dh-more">+' + (stuck.length - 4) + ' more overdue</div>';
      }
    }
    pjHtml += '<div class="v10-dh-footnote"><em>Deal-age tracking arrives with Bigin Created_Time field. Stuck detection today uses close date only.</em></div>';
    pjHtml += '</div></div>';

    /* Column 3: Project Economics — gross margin distribution + benchmark + WIP */
    /* Build CM distribution from closed projects */
    var cmBuckets = [
      {label: '<20%', range: [0, 20], count: 0, color: COLOR.red},
      {label: '20-30%', range: [20, 30], count: 0, color: COLOR.amber},
      {label: '30-40%', range: [30, 40], count: 0, color: COLOR.accent},
      {label: '40-50%', range: [40, 50], count: 0, color: COLOR.green},
      {label: '50%+', range: [50, 1000], count: 0, color: COLOR.green}
    ];
    proj.forEach(function(p){
      var cm = p.contributionPct || 0;
      cmBuckets.forEach(function(b){
        if (cm >= b.range[0] && cm < b.range[1]) b.count++;
      });
    });
    var maxCmCount = Math.max.apply(null, cmBuckets.map(function(b){return b.count;}));
    var aboveAgencyTarget = proj.filter(function(p){return p.contributionPct >= 40;}).length;
    var atOrAboveConstructionFloor = proj.filter(function(p){return p.contributionPct >= 30;}).length;

    /* WIP — Bigin Closed Won not yet in Sheet (zero today, but useful when drift starts) */
    var sheetCompanies = {};
    proj.forEach(function(p){ sheetCompanies[p.company.toLowerCase()] = true; });
    var wipDeals = pipeline.filter(function(d){
      if (d.bucket !== 'won') return false;
      var name = (d.account_name || '').toLowerCase();
      return !Object.keys(sheetCompanies).some(function(c){
        return c.indexOf(name) !== -1 || name.indexOf(c) !== -1;
      });

    pjHtml += '<div class="v10-dh-pod v11-dh-econ">'
      + '<div class="v10-dh-head">'
      +   '<div class="v10-dh-title">Project economics</div>'
      +   '<div class="v10-dh-metric">' + closedCM.toFixed(0) + '%</div>'
      + '</div>'
      + '<div class="v10-dh-sub">blended CM across ' + proj.length + ' closed projects</div>'
      + '<div class="v10-dh-body">';

    /* CM distribution histogram */
    pjHtml += '<div class="v11-cm-dist-label">CM distribution · benchmark <strong>≥30%</strong> floor · <strong>40%+</strong> target</div>';
    pjHtml += '<div class="v11-cm-dist">';
    cmBuckets.forEach(function(b){
      var widthPct = maxCmCount > 0 ? (b.count / maxCmCount * 100) : 0;
      pjHtml += '<div class="v11-cm-row">'
        + '<div class="v11-cm-label">' + b.label + '</div>'
        + '<div class="v11-cm-bar"><div class="v11-cm-fill" style="width:' + widthPct + '%;background:' + b.color + '"></div></div>'

    pjHtml += '</div>';

    pjHtml += '<div class="v11-cm-summary">'

    pjHtml += '<div class="v11-econ-divider"></div>';
    pjHtml += '<div class="v11-econ-stat-row">'

    pjHtml += '<div class="v10-dh-footnote"><em>n=' + proj.length + ' closed projects: too few for statistical reliability. Distribution shape will sharpen with more data through FY27.</em></div>';
    pjHtml += '</div></div>';

    pjHtml += '</div>';  /* end v10-dh-grid */


    /* ════════ THE 5 LEVERS — compressed strip ════════ */
    pjHtml += '<div class="v7-section-title">The 5 <em>levers</em> · compressed view</div>';

    var levers = [
      {num:1, title:'Raise the average ticket', pct: avgTicket / 4000000 * 100, subLabel: fmt(avgTicket) + ' → ₹40L'},
      {num:2, title:'Reduce Secure dependency', pct: secureSharePct <= 25 ? 100 : secureSharePct <= 30 ? 80 : secureSharePct <= 40 ? 50 : 25, subLabel: secureSharePct.toFixed(0) + '% → ≤25%', inverted:true},
      {num:3, title:'Hire two sales hunters', pct: 0, subLabel: '0 → 2', isPriority:true},
      {num:4, title:'Build international engine', pct: 31500000 / 100000000 * 100, subLabel: '₹3.15 → ₹10Cr'},
      {num:5, title:'Raise India project floor', pct: indiaAvg / 2000000 * 100, subLabel: fmt(indiaAvg) + ' → ₹20L'},
    ];

    pjHtml += '<div class="v8-lever-strip">';
    levers.forEach(function(L){

      pjHtml += '<div class="v8-lever-pill' + (L.isPriority ? ' v8-lever-priority' : '') + '">'
        + '<div class="v8-lever-pill-num">' + L.num + '</div>'
        + '<div class="v8-lever-pill-body">'
        +   '<div class="v8-lever-pill-title">' + esc(L.title) + (L.isPriority ? ' <span class="v8-lever-pill-tag">highest leverage</span>' : '') + '</div>'
        +   '<div class="v8-lever-pill-sub">' + esc(L.subLabel) + '</div>'
        +   '<div class="v8-lever-pill-bar">'
        +     '<div class="v8-lever-pill-bar-fill" style="width:' + pctCapped + '%;background:' + color + '"></div>'

        + '</div>'
        + '<div class="v8-lever-pill-pct">' + Math.round(L.pct) + '%</div>'
        + '</div>';
    });
    pjHtml += '</div>';
    pjHtml += '<div class="v8-lever-footnote"><em>Levers are the FY29 plan — static until reviewed. Full bet options in /plan doc.</em></div>';

    /* ════════ DEMOTED ════════ */
    pjHtml += '<div class="v7-demote-header">Supporting <em>data</em></div>';
    pjHtml += '<div class="v7-demote-note">Operational items (CK shadowing, fabricator decisions, lead cleanup) live in the morning briefing and Sonal\'s task list — not here.</div>';

    pjHtml += '<div class="v7-demote-block">';
    pjHtml += '<div class="v7-demote-title">Closed projects · FY26-27 YTD</div>';
    pjHtml += '<div class="v7-muted"><table class="proj-table">'
      + '<thead><tr>'
      + '<th>Code</th><th>Client</th><th>Region</th><th>Industry</th><th>Exec</th>'
      + '<th class="num">Sqm</th><th class="num">SP</th><th class="num">CP</th><th class="num">SP/sqm</th><th class="num">CP/sqm</th><th class="num">Margin</th><th>CM%</th>'
      + '</tr></thead><tbody>';
    proj.forEach(function(p){
      var cmCls = p.contributionPct >= 50 ? 'good' : p.contributionPct >= 30 ? 'mid' : 'bad';
      pjHtml += '<tr>'
        + '<td><span class="proj-code">' + esc(p.projectNo) + '</span></td>'
        + '<td>' + esc(p.company) + (p.isRepeat ? ' <span class="proj-repeat-dot">●</span>' : '') + '</td>'
        + '<td>' + esc(p.region) + '</td>'
        + '<td style="font-size:11px;color:var(--text-tertiary)">' + esc(p.industry) + '</td>'
        + '<td><span class="proj-exec-tag">' + esc(p.exec) + '</span></td>'
        + '<td class="num">' + p.sizeSqm + '</td>'
        + '<td class="num">' + fmt(p.sales) + '</td>'
        + '<td class="num">' + fmt(p.variableCost) + '</td>'
        + '<td class="num" style="color:var(--text-secondary)">' + (p.sizeSqm > 0 ? fmt(p.sales / p.sizeSqm) : '—') + '</td>'
        + '<td class="num" style="color:var(--text-secondary)">' + (p.sizeSqm > 0 ? fmt(p.variableCost / p.sizeSqm) : '—') + '</td>'
        + '<td class="num">' + fmt(p.contribution) + '</td>'
        + '<td><span class="proj-cm-pill ' + cmCls + '">' + p.contributionPct + '%</span></td>'
        + '</tr>';
    });
    pjHtml += '</tbody></table></div></div>';

    document.getElementById("page-projects").innerHTML = pjHtml;
  }

  document.getElementById("page-telegram").innerHTML =
    '<div class="page-title">Daily <em>briefing</em></div>'
    + '<div class="page-sub">Telegram summary sent 08:00 IST</div>'
    + '<div class="telegram-banner">' + esc(FR.telegramBriefing || "(No briefing)") + '</div>';

  /* SOURCES */
  var srcHtml = '<div class="page-title">Data <em>sources</em></div>'
    + '<div class="page-sub">Connection status · last accessed</div>';
  (META.sources || []).forEach(function(s) {
    var st = s.status || (s.ok ? "ok" : "failed");
    var indCls = st === "stale" ? "stale" : (s.ok ? "ok" : "err");
    var badgeLabel = st === "ok" ? "Live" : st === "stale" ? "Stale" : "Failed";
    var tsLine = s.lastAccessedFmt && s.lastAccessedFmt !== "—"
      ? '<div class="src-ts">'
        + '<span class="src-ts-badge ' + st + '">' + esc(badgeLabel) + '</span>'
        + esc(s.lastAccessedFmt)
        + '</div>'
      : '';
    srcHtml += '<div class="src-card">'
      + '<span class="src-indicator ' + indCls + '"></span>'
      + '<div class="src-text">'
      +   '<div class="src-name">' + esc(s.name) + '</div>'
      +   '<div class="src-detail">' + esc(s.detail) + '</div>'
      +   tsLine
      + '</div>'
      + '</div>';
  });
  srcHtml += '<div style="margin-top:16px;padding:14px 16px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--r);font-size:11px;color:var(--text-tertiary);line-height:1.6">'
    + '<div style="color:var(--accent);font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:600">Refresh info</div>'
    + 'Last: ' + esc(META.lastRefresh || "—") + '<br>'
    + 'Auto-regenerated every /finance run<br>'
    + 'Bookmark: cfo-dashboard-alt-latest.html'
    + '</div>';
  document.getElementById("page-sources").innerHTML = srcHtml;

})();
</script>

</body>
</html>
