<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#f9f9f8" id="theme-meta"/>
<title>First Rain · CFO OS — Alt</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════════════════════════════════════
   FIRST RAIN · CFO OS — ALTERNATE (v4 reference design system)
   Cream paper + Instrument Serif italic + burnt orange
   Sidebar (desktop) / bottom nav (mobile)
   ══════════════════════════════════════════════════════════════════ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg-primary:#f9f9f8;--bg-secondary:#f3f3ef;--bg-tertiary:#ebebea;
  --surface:#ffffff;
  --text-primary:#1a1a1a;--text-secondary:#4a4a4a;
  --text-tertiary:#757575;--text-muted:#a0a0a0;

  --accent:#cc4b00;--accent-hover:#b34200;
  --accent-light:#fff2ec;--accent-border:#f5c9b0;

  --green:#1d7a4a;--green-bg:#f0faf5;--green-border:#a7e0c3;
  --amber:#9a6400;--amber-bg:#fefbf0;--amber-border:#f0d78f;
  --red:#c0392b;--red-bg:#fff5f5;--red-border:#f5b8b8;
  --blue:#1a56aa;--blue-bg:#f0f5ff;--blue-border:#b3cdf5;

  --border:#e5e5e3;--border-strong:#d0d0ce;

  --shadow-xs:0 1px 2px rgba(0,0,0,.04);
  --shadow-sm:0 1px 4px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --shadow-md:0 2px 8px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.05);
  --shadow-lg:0 8px 24px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.06);

  --r-xs:4px;--r-sm:8px;--r:12px;--r-lg:16px;--r-xl:20px;--r-2xl:24px;

  --sidebar-w:240px;--topbar-h:56px;--mobile-nav-h:60px;

  --t:.15s cubic-bezier(.4,0,.2,1);
  --t-slow:.25s cubic-bezier(.4,0,.2,1);

  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

[data-theme="dark"]{
  --bg-primary:#0f0f0e;--bg-secondary:#1a1a18;--bg-tertiary:#25251f;
  --surface:#1a1a18;
  --text-primary:#faf9f6;--text-secondary:#d0cfc9;
  --text-tertiary:#9d9b92;--text-muted:#6a6860;
  --accent:#f07a3a;--accent-hover:#ff8c52;
  --accent-light:#2a1810;--accent-border:#5a3018;
  --green-bg:#0f2418;--green-border:#1d5236;
  --amber-bg:#241a08;--amber-border:#5a421a;
  --red-bg:#2a1010;--red-border:#5a2422;
  --blue-bg:#0e1a2e;--blue-border:#1c3556;
  --border:#2a2a25;--border-strong:#45443d;
  --shadow-xs:0 1px 2px rgba(0,0,0,.2);
  --shadow-sm:0 1px 4px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.2);
  --shadow-md:0 2px 8px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
  --shadow-lg:0 8px 24px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
}

html{-webkit-text-size-adjust:100%;height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.6;
  background:var(--bg-primary);color:var(--text-primary);
  height:100%;overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background .2s,color .2s;
}

.serif{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.fade{animation:fadeIn .3s cubic-bezier(.3,.9,.3,1) both}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}.d4{animation-delay:.26s}

.app{display:flex;height:100vh;overflow:hidden}

/* ═══ SIDEBAR ═══ */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--bg-secondary);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  transition:transform var(--t-slow);z-index:200;
}
.sb-head{padding:18px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-wordmark{
  font-family:'Instrument Serif',Georgia,serif;font-size:22px;line-height:1.1;
  color:var(--text-primary);letter-spacing:-.01em;
}
.sb-wordmark em{font-style:italic;color:var(--accent)}
.sb-tagline{font-size:11px;color:var(--text-muted);margin-top:2px}
.sb-sync{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-muted);margin-top:6px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted)}
.sync-dot.live{background:var(--green);animation:pulse 2s infinite}
.sync-dot.error{background:var(--red)}

.sb-scroll{flex:1;overflow-y:auto;padding:8px;scrollbar-width:none}
.sb-scroll::-webkit-scrollbar{display:none}
.sb-section{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);padding:16px 8px 4px}
.sb-btn{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:8px 10px;border:none;background:transparent;cursor:pointer;
  border-radius:var(--r-sm);font-family:'Inter',sans-serif;font-size:13px;
  font-weight:500;color:var(--text-secondary);text-align:left;
  transition:background var(--t),color var(--t);
}
.sb-btn:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.sb-btn.on{background:var(--surface);color:var(--text-primary);font-weight:600;box-shadow:var(--shadow-xs)}
.sb-btn.on .sb-icon{color:var(--accent)}
.sb-icon{width:16px;height:16px;flex-shrink:0;opacity:.65;font-size:14px}
.sb-btn.on .sb-icon{opacity:1}
.sb-badge{
  margin-left:auto;font-size:10px;font-weight:600;
  padding:1px 6px;border-radius:99px;
  background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);
}
.sb-badge.ok{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.sb-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);flex-shrink:0}

/* ═══ MAIN ═══ */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ═══ TOPBAR ═══ */
.topbar{
  height:var(--topbar-h);flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:12px;
  position:relative;z-index:100;
}
.tb-menu{display:none;background:none;border:none;cursor:pointer;padding:4px;color:var(--text-secondary)}
.tb-breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);min-width:0}
.tb-org{font-weight:600;color:var(--text-primary);white-space:nowrap}
.tb-sep{color:var(--text-muted)}
.tb-page-label{color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-gap{flex:1}
.tb-date{font-size:12px;color:var(--text-tertiary);white-space:nowrap}

.health-badge{
  display:flex;align-items:center;gap:5px;
  font-size:11px;font-weight:600;
  padding:4px 10px;border-radius:99px;
  border:1px solid var(--red-border);background:var(--red-bg);color:var(--red);
  cursor:pointer;transition:all var(--t);white-space:nowrap;
}
.health-badge:hover{filter:brightness(1.05)}
.health-badge.success{border-color:var(--green-border);background:var(--green-bg);color:var(--green)}
.health-badge.warning{border-color:var(--amber-border);background:var(--amber-bg);color:var(--amber)}

.theme-btn{
  width:30px;height:30px;background:transparent;
  border:1px solid var(--border);color:var(--text-tertiary);
  font-size:14px;cursor:pointer;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
  transition:border-color var(--t),color var(--t);
}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ═══ PAGES ═══ */
.pages{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.pages::-webkit-scrollbar{width:5px}
.pages::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

.page{display:none;padding:28px 24px 60px;max-width:1200px}
.page.on{display:block;animation:fadeIn .25s ease}

.page-title{
  font-family:'Instrument Serif',Georgia,serif;font-size:32px;line-height:1.15;
  color:var(--text-primary);letter-spacing:-.02em;margin-bottom:4px;font-weight:400;
}
.page-title em{font-style:italic;color:var(--accent)}
.page-sub{font-size:13px;color:var(--text-tertiary);margin-bottom:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-label{
  font-family:'Instrument Serif',Georgia,serif;font-size:22px;font-style:italic;
  font-weight:400;color:var(--text-primary);letter-spacing:-.01em;
  margin:24px 0 12px;
}
.section-label:first-child{margin-top:0}
.section-label em{color:var(--accent)}

/* ═══ HERO ═══ */
.hero{
  background:linear-gradient(135deg,#1a2a3a 0%,#243648 100%);
  border-radius:var(--r-xl);padding:24px;margin-bottom:20px;
  color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-md);
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 80% 50%,rgba(204,75,0,.22) 0%,transparent 60%);
  pointer-events:none;
}
.hero-eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.5;margin-bottom:6px;position:relative}
.hero-title{font-family:'Instrument Serif',Georgia,serif;font-size:30px;line-height:1.15;letter-spacing:-.02em;margin-bottom:6px;font-weight:400;position:relative}
.hero-title em{font-style:italic;color:#f5aa7a}
.hero-amount{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:56px;line-height:1;letter-spacing:-.03em;font-weight:400;margin:12px 0 6px;color:#fff;position:relative}
.hero-amount.danger{color:#ff8a73}
.hero-sub{font-size:13px;opacity:.7;line-height:1.5;margin-bottom:18px;position:relative}
.hero-kpis{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.hkpi{background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:var(--r);padding:10px 14px;text-align:center;min-width:80px;flex:1}
.hkpi-n{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:22px;line-height:1;letter-spacing:-.02em}
.hkpi-l{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin-top:3px}
.od-strip{margin-top:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--r);padding:12px 14px;position:relative}
.od-strip-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.od-strip-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.od-strip-pct{font-size:11px;font-weight:700;opacity:.85}
.od-strip-pct.warn{color:#f5c97a;opacity:1}
.od-strip-pct.danger{color:#ff8a73;opacity:1}
.od-bar{height:7px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
.od-bar-fill{height:100%;border-radius:6px;background:#5fb98a;transition:width .4s ease}
.od-bar-fill.warn{background:#f5c97a}
.od-bar-fill.danger{background:#ff8a73}
.od-strip-bot{display:flex;gap:8px;margin-top:10px}
.od-cell{flex:1;text-align:center}
.od-cell-n{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:20px;line-height:1;letter-spacing:-.02em}
.od-cell-n.green{color:#5fb98a}
.od-cell-l{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.55;margin-top:3px}
.acct-strip{margin-top:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--r);padding:12px 14px;position:relative}
.acct-strip-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.acct-strip-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.acct-strip-bal{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:22px;line-height:1}
.acct-strip-bal.neg{color:#ff8a73}
.acct-strip-bal.pos{color:#5fb98a}
.acct-strip-meta{font-size:11px;opacity:.6;margin-top:2px}
.acct-txn-head{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.5;margin:10px 0 2px}
.acct-txn{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid rgba(255,255,255,.08)}
.acct-txn-dir{flex:0 0 auto;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;line-height:1}
.acct-txn-dir.in{background:rgba(95,185,138,.18);color:#5fb98a}
.acct-txn-dir.out{background:rgba(255,138,115,.18);color:#ff8a73}
.acct-txn-body{flex:1;min-width:0}
.acct-txn-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-txn-insight{font-size:10px;opacity:.55;letter-spacing:.03em;text-transform:uppercase;margin-top:1px}
.acct-txn-amt{flex:0 0 auto;font-size:12px;font-weight:700;text-align:right}
.acct-txn-amt.in{color:#5fb98a}
.acct-txn-amt.out{color:#ff8a73}
.acct-txn-date{display:block;font-size:10px;font-weight:500;opacity:.5;color:#fff;margin-top:1px}
.acct-foot{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;opacity:.78;line-height:1.5}
.acct-truth{color:#5fb98a;font-weight:600}
.acct-disc{color:#f5c97a;font-weight:600}
.ov-split{display:flex;gap:20px;align-items:stretch;margin-bottom:20px}
.ov-col{flex:1 1 0;min-width:0}
.ov-col-hero .hero{margin-bottom:0;height:100%}
.ov-col-priority{
  display:flex;flex-direction:column;
  background:linear-gradient(135deg,#1a2a3a 0%,#243648 100%);
  border-radius:var(--r-xl);padding:24px;color:#fff;
  position:relative;overflow:hidden;box-shadow:var(--shadow-md);
}
.ov-col-priority::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 80% 50%,rgba(204,75,0,.22) 0%,transparent 60%);
  pointer-events:none;
}
.ov-col-priority > *{position:relative;z-index:1}
.ov-col-priority .section-label{margin:0 0 14px;color:#fff}
.ov-col-priority .action-card{
  background:rgba(255,255,255,.06);
  border-top-color:rgba(255,255,255,.14);
  border-right-color:rgba(255,255,255,.14);
  border-bottom-color:rgba(255,255,255,.14);
}
.ov-col-priority .action-card:last-child{margin-bottom:0}
.ov-col-priority .action-text{color:rgba(255,255,255,.82)}
.ov-col-priority .action-card.critical .action-text{color:#fff}

/* ═══ RUNWAY ═══ */
.runway-banner{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-radius:var(--r);
  margin-bottom:16px;font-size:12px;font-weight:600;
  background:var(--red-bg);border:1px solid var(--red-border);color:var(--red);
}
.runway-banner.success{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
.runway-banner.warning{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber)}
.runway-live-dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
.runway-metric{margin-left:auto;font-weight:700}

/* ═══ STATS ═══ */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-xs);transition:box-shadow var(--t)}
.stat:hover{box-shadow:var(--shadow-sm)}
.stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:8px}
.stat-val{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:28px;line-height:1;color:var(--text-primary);letter-spacing:-.02em;margin-bottom:4px;font-weight:400}
.stat-val.green{color:var(--green)}
.stat-val.red{color:var(--red)}
.stat-val.amber{color:var(--amber)}
.stat-val.accent{color:var(--accent)}
.stat-hint{font-size:11px;color:var(--text-tertiary)}

/* ═══ TAGS ═══ */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 8px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.tag-green{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.tag-red{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.tag-amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-border)}
.tag-blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-border)}
.tag-orange{background:var(--accent-light);color:var(--accent);border-color:var(--accent-border)}
.tag-neutral{background:var(--bg-secondary);color:var(--text-secondary);border-color:var(--border)}

/* ═══ ACTION CARDS ═══ */
.action-card{
  display:flex;gap:11px;padding:12px 14px;
  background:var(--surface);border:1px solid var(--border);
  border-left:3px solid var(--text-tertiary);border-radius:var(--r);
  margin-bottom:8px;box-shadow:var(--shadow-xs);
  transition:box-shadow var(--t),transform var(--t);
}
.action-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.action-card.critical{border-left-color:var(--red);background:var(--red-bg)}
.action-card.warning{border-left-color:var(--amber);background:var(--amber-bg)}
.action-card.watch{border-left-color:var(--accent);background:var(--accent-light)}
.action-card.success{border-left-color:var(--green);background:var(--green-bg)}
.action-icon{flex:0 0 auto;font-size:14px;line-height:1.4;padding-top:1px}
.action-text{font-size:12px;color:var(--text-secondary);flex:1;line-height:1.55}
.action-card.critical .action-text{color:var(--text-primary);font-weight:500}

/* ═══ TREASURY SWEEP (bidirectional — outward deploys surplus, inward monitors deficit) ═══ */
.sweep-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:16px 18px 14px;margin-bottom:16px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.sweep-card.sweep-out{
  border-left:4px solid var(--green);
  background:linear-gradient(135deg, var(--green-bg) 0%, var(--surface) 60%);
}
.sweep-card.sweep-in{
  border-left:4px solid var(--amber);
  background:linear-gradient(135deg, var(--amber-bg) 0%, var(--surface) 60%);
}
.sweep-card.sweep-neutral{
  border-left:4px solid var(--border);
}
.sweep-header{
  display:flex;align-items:center;gap:14px;margin-bottom:10px;
}
.sweep-arrow{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:44px;line-height:1;font-weight:400;
  flex-shrink:0;width:50px;text-align:center;
}
.sweep-out .sweep-arrow{color:var(--green)}
.sweep-in  .sweep-arrow{color:var(--amber)}
.sweep-neutral .sweep-arrow{color:var(--text-tertiary)}
.sweep-header-text{flex:1;min-width:0}
.sweep-label{
  font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:2px;
}
.sweep-out .sweep-label{color:var(--green)}
.sweep-in  .sweep-label{color:var(--amber)}
.sweep-verdict{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:24px;line-height:1.2;color:var(--text-primary);letter-spacing:-.01em;
}
.sweep-amount{text-align:right;flex-shrink:0}
.sweep-amount-label{
  font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:2px;
}
.sweep-amount-value{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:30px;line-height:1;color:var(--green);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.sweep-in .sweep-amount-value{color:var(--amber)}
.sweep-body{
  font-size:12px;color:var(--text-secondary);line-height:1.55;
  padding:8px 0 10px;border-top:1px solid var(--border);margin-top:6px;
}
.sweep-footer{
  display:flex;gap:20px;flex-wrap:wrap;
  padding-top:8px;border-top:1px dashed var(--border);
}
.sweep-footer-item{display:flex;flex-direction:column;gap:1px;flex:1;min-width:120px}
.sweep-footer-label{
  font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-muted);
}
.sweep-footer-value{
  font-size:12px;font-weight:500;color:var(--text-primary);
}
.sweep-footer-hint{
  font-size:11px;color:var(--text-secondary);line-height:1.5;font-style:italic;
  padding:6px 0 2px;border-top:1px dashed var(--border);
}
.sweep-footer-hint em{
  font-family:'Instrument Serif',Georgia,serif;color:var(--accent);font-style:italic;
}
.sweep-howto{
  font-size:11px;color:var(--text-secondary);line-height:1.5;
  padding:8px 0 2px;font-family:'Instrument Serif',Georgia,serif;font-style:italic;
}
.sweep-howto em{color:var(--green);font-weight:600;font-style:normal;font-family:Inter,sans-serif;font-size:9px;letter-spacing:.06em;text-transform:uppercase}
.sweep-config{
  font-size:10px;color:var(--text-tertiary);margin-top:10px;
  padding-top:8px;border-top:1px dashed var(--border);
  font-variant-numeric:tabular-nums;
}

/* ═══ LEVERS (decision framework) ═══ */
.levers-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:10px;margin-bottom:14px;
}
.lever-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:16px 14px 14px;
  box-shadow:var(--shadow-xs);transition:box-shadow var(--t);
  position:relative;overflow:hidden;
}
.lever-card:hover{box-shadow:var(--shadow-sm)}
.lever-card.rank-1{border-left:3px solid var(--green)}
.lever-card.rank-2{border-left:3px solid var(--blue)}
.lever-card.rank-3{border-left:3px solid var(--amber)}
.lever-card.rank-4{border-left:3px solid var(--accent)}
.lever-rank{
  position:absolute;top:10px;right:12px;
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;
  font-size:40px;line-height:1;letter-spacing:-.02em;color:var(--text-muted);opacity:.35;
}
.lever-card.rank-1 .lever-rank{color:var(--green)}
.lever-card.rank-2 .lever-rank{color:var(--blue)}
.lever-card.rank-3 .lever-rank{color:var(--amber)}
.lever-card.rank-4 .lever-rank{color:var(--accent)}
.lever-body{position:relative}
.lever-title{
  font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
  color:var(--text-primary);margin-bottom:2px;
}
.lever-title em{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  color:var(--accent);font-weight:400;
}
.lever-cost{
  font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:8px;
}
.lever-amount{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:26px;font-weight:400;letter-spacing:-.02em;
  color:var(--text-primary);margin-bottom:10px;
}
.lever-split{
  display:flex;flex-direction:column;gap:3px;
  padding-top:8px;border-top:1px solid var(--border);
  margin-bottom:10px;
}
.lever-split > div{
  font-size:11px;color:var(--text-secondary);
  display:flex;align-items:center;gap:6px;
}
.lever-split-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
  background:var(--text-muted);
}
.lever-split-dot.cert{background:var(--green)}
.lever-split-dot.prob{background:var(--blue)}
.lever-split-dot.maybe{background:var(--amber)}
.lever-split-dot.info{background:var(--blue)}
.lever-split-dot.warn{background:var(--red)}
.lever-note{
  font-size:10px;color:var(--text-tertiary);line-height:1.45;
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
}

.decision-rule{
  background:var(--accent-light);border:1px solid var(--accent-border);
  border-radius:var(--r);padding:12px 16px;margin-bottom:20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.decision-rule-label{
  font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);flex-shrink:0;
}
.decision-rule-text{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:15px;color:var(--text-primary);line-height:1.4;flex:1;
}
.decision-rule-text em{
  color:var(--accent);font-style:italic;
  text-decoration:underline;text-underline-offset:3px;
  text-decoration-thickness:1px;
}

/* ═══ FD HOLDINGS CARD ═══ */
.fd-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);overflow:hidden;margin-bottom:20px;
  box-shadow:var(--shadow-xs);
}
.fd-card-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--border);
}
.fd-header-main{display:flex;flex-direction:column;gap:1px;}
.fd-header-label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}
.fd-header-total{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:22px;line-height:1.1;color:var(--text-primary);}
.fd-header-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.fd-count-badge{
  font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 8px;border-radius:99px;
  background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);
}
.fd-header-gain{font-size:13px;font-weight:600;color:var(--green);}
.fd-header-gain-label{font-size:10px;color:var(--text-muted);}
/* per-FD row */
.fd-item{
  display:grid;grid-template-columns:36px 1fr auto;
  gap:0 12px;padding:12px 16px;border-bottom:1px solid var(--border);
  align-items:start;
}
.fd-item:last-child{border-bottom:none}
.fd-avatar{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;margin-top:2px;
  background:var(--amber-bg);border:1px solid var(--amber-border);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;color:var(--amber);letter-spacing:-.02em;
}
.fd-item-center{min-width:0;}
.fd-item-name{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fd-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.fd-chip{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;letter-spacing:.01em;}
.fd-chip-rate{background:var(--amber-bg);color:var(--amber);}
.fd-chip-tenure{background:var(--bg-secondary);color:var(--text-secondary);}
.fd-chip-mat{background:var(--bg-secondary);color:var(--text-tertiary);font-weight:400;}
.fd-progress-row{display:flex;align-items:center;gap:8px;}
.fd-progress-track{flex:1;height:3px;background:var(--bg-tertiary);border-radius:99px;overflow:hidden;}
.fd-progress-fill{height:100%;border-radius:99px;background:var(--amber);transition:width .4s ease;}
.fd-progress-fill.near{background:var(--red);}
.fd-days{font-size:10px;font-weight:700;flex-shrink:0;min-width:28px;text-align:right;}
.fd-days.green{color:var(--green)} .fd-days.amber{color:var(--amber)} .fd-days.red{color:var(--red)}
.fd-item-right{text-align:right;flex-shrink:0;}
.fd-item-value{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:15px;color:var(--text-primary);line-height:1.2;margin-bottom:2px;}
.fd-item-gain{font-size:11px;font-weight:600;color:var(--green);}
.fd-item-penalty{font-size:10px;color:var(--text-muted);margin-top:3px;}
.fd-empty{
  padding:24px 16px;text-align:center;
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:14px;color:var(--text-muted);
}
@media(max-width:480px){
  .fd-item{grid-template-columns:32px 1fr auto;gap:0 10px;padding:10px 14px;}
  .fd-avatar{width:30px;height:30px;font-size:8px;}
  .fd-item-name{font-size:12px;}
  .fd-chip{font-size:9px;padding:1px 5px;}
  .fd-chip-mat{display:none;}
  .fd-item-value{font-size:14px;}
}

/* ═══ DEFICIT STRATEGY (on month cards) ═══ */
.deficit-strategy{
  background:var(--accent-light);border-top:1px solid var(--accent-border);
  padding:12px 14px;
}
.deficit-strategy-label{
  font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:6px;
}
.deficit-strategy-rec{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:15px;color:var(--text-primary);line-height:1.4;margin-bottom:8px;
}
.deficit-lever-row{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;padding:3px 0;
}
.deficit-lever-name{color:var(--text-secondary);font-weight:500;display:flex;align-items:center;gap:6px}
.deficit-lever-amt{font-weight:600;color:var(--text-primary);font-variant-numeric:tabular-nums}
.deficit-lever-cost{color:var(--text-muted);font-size:10px;margin-left:6px}
.deficit-rationale{
  margin-top:8px;font-size:11px;color:var(--text-secondary);line-height:1.55;
  padding-top:8px;border-top:1px dashed var(--accent-border);
}

/* Flexibility tag on Pay panel rows */
.flex-tag{
  display:inline-flex;align-items:center;gap:3px;
  font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:1px 6px;border-radius:99px;border:1px solid currentColor;
  margin-left:4px;
}
.flex-tag.must-pay{color:var(--red);background:var(--red-bg)}
.flex-tag.can-delay-7d{color:var(--amber);background:var(--amber-bg)}
.flex-tag.can-delay-30d{color:var(--green);background:var(--green-bg)}
.flex-note{
  font-size:10px;color:var(--text-muted);font-style:italic;
  font-family:'Instrument Serif',Georgia,serif;margin-top:3px;
}

/* ═══ ANNUAL ═══ */
.annual-hero{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:22px 20px;margin-bottom:14px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.annual-hero::before{content:'';position:absolute;top:0;right:0;width:120px;height:120px;background:radial-gradient(circle,var(--accent-light) 0%,transparent 70%);pointer-events:none}
.annual-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;position:relative}
.annual-value{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:52px;line-height:1;letter-spacing:-.03em;margin-bottom:14px;font-weight:400;position:relative}
.annual-value.success{color:var(--green)}
.annual-value.critical{color:var(--red)}
.annual-breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:12px;border-top:1px solid var(--border);position:relative}
.annual-breakdown-label{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:3px}
.annual-breakdown-val{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:20px;font-weight:400;letter-spacing:-.01em}
.annual-breakdown-val.in{color:var(--green)}
.annual-breakdown-val.out{color:var(--red)}

/* ═══ METHODOLOGY ═══ */
.meth-card{background:var(--bg-secondary);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:12px;line-height:1.55;color:var(--text-secondary)}
.meth-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.meth-row{margin-bottom:3px}
.meth-row strong{color:var(--text-primary);font-weight:600}

/* ═══ QUARTER ═══ */
.quarter-header{display:flex;align-items:baseline;justify-content:space-between;padding:14px 0 8px;margin:22px 0 8px;border-bottom:1px solid var(--border)}
.quarter-label{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:22px;font-weight:400;color:var(--text-primary);letter-spacing:-.01em}
.quarter-period{font-size:11px;color:var(--text-tertiary);font-weight:400;letter-spacing:.02em;margin-left:8px}
.quarter-net{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:22px;font-weight:400;letter-spacing:-.01em}
.quarter-net.success{color:var(--green)}
.quarter-net.critical{color:var(--red)}

.q-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-xs)}
.q-hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.q-hero-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.q-hero-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-top:10px;border-top:1px solid var(--border)}
.q-hero-cell-label{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:3px}
.q-hero-cell-val{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:16px;font-weight:400;letter-spacing:-.01em}
.q-hero-cell-val.in{color:var(--green)}
.q-hero-cell-val.out{color:var(--red)}

.notes-card{background:var(--blue-bg);border:1px solid var(--blue-border);border-left:3px solid var(--blue);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.notes-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:5px}
.notes-text{font-size:12px;color:var(--text-secondary);line-height:1.6}

/* ═══ MONTH ═══ */
.month-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px;overflow:hidden;box-shadow:var(--shadow-xs);transition:box-shadow var(--t)}
.month-card:hover{box-shadow:var(--shadow-sm)}
.month-card.critical{border-left:3px solid var(--red)}
.month-card.success{border-left:3px solid var(--green)}
.month-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;min-height:44px;gap:8px}
.month-head-left{display:flex;flex-direction:column;min-width:0;gap:2px}
.month-label{font-size:13px;font-weight:600;color:var(--text-primary)}
.month-period{font-size:10px;color:var(--text-muted);letter-spacing:.02em}
.month-head-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.month-net{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:19px;font-weight:400;letter-spacing:-.01em}
.month-net.success{color:var(--green)}
.month-net.critical{color:var(--red)}
.month-chev{color:var(--text-muted);font-size:14px;transition:transform var(--t)}
.month-card.open .month-chev{transform:rotate(90deg)}
.month-body{max-height:0;overflow:hidden;transition:max-height var(--t-slow);background:var(--bg-secondary)}
.month-card.open .month-body{max-height:820px;border-top:1px solid var(--border)}
.month-body-inner{padding:10px 14px 12px}

.flow-section{margin-bottom:8px}
.flow-section:last-child{margin-bottom:0}
.flow-section-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.flow-section-label.in{color:var(--green)}
.flow-section-label.out{color:var(--red)}
.flow-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.flow-row-label{color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.flow-row-amount{font-family:'Inter',sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.flow-row-amount.in{color:var(--green)}
.flow-row-amount.out{color:var(--red)}
.flow-row-total{display:flex;justify-content:space-between;padding-top:5px;margin-top:4px;border-top:1px solid var(--border);font-size:12px;font-weight:700}
.flow-row-total-label{color:var(--text-secondary)}

.src-tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.src-tag.gmail{background:var(--blue-bg);color:var(--blue)}
.src-tag.gsheet{background:var(--green-bg);color:var(--green)}
.src-tag.bigin{background:var(--accent-light);color:var(--accent)}

.conf-chip{font-size:9px;font-weight:600;padding:1px 6px;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;border:1px solid currentColor}
.conf-chip.high{color:var(--green);background:var(--green-bg)}
.conf-chip.medium{color:var(--amber);background:var(--amber-bg)}
.conf-chip.low{color:var(--text-muted);background:var(--bg-secondary);border-color:var(--border-strong)}

/* ═══ LIST ═══ */
.list-row{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px;gap:12px;min-height:44px;box-shadow:var(--shadow-xs);transition:box-shadow var(--t)}
.list-row:hover{box-shadow:var(--shadow-sm)}
.list-row.critical{border-left:3px solid var(--red)}
.list-row.warning{border-left:3px solid var(--amber)}
.list-row.watch{border-left:3px solid var(--accent)}
.list-row.success{border-left:3px solid var(--green)}
.list-row-main{flex:1;min-width:0}
.list-row-title{font-size:13px;color:var(--text-primary);font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px}
.list-row-sub{font-size:11px;color:var(--text-muted);letter-spacing:.01em}
.list-row-right{text-align:right;flex:0 0 auto}
.list-row-amount{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:20px;font-weight:400;line-height:1;letter-spacing:-.01em}
.list-row.critical .list-row-amount{color:var(--red)}
.list-row.warning .list-row-amount{color:var(--amber)}
.list-row-amount-sub{font-size:10px;color:var(--text-muted);margin-top:4px;letter-spacing:.04em;text-transform:uppercase;font-weight:500}

.empty-state{text-align:center;padding:40px 16px;color:var(--text-muted)}
.empty-state-icon{font-size:28px;color:var(--green);margin-bottom:8px}
.empty-state-text{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:16px;color:var(--text-tertiary)}

/* ═══ HEALTH ═══ */
.health-hero{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:32px 24px 26px;margin-bottom:16px;text-align:center;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.health-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,var(--red-bg) 0%,transparent 70%);pointer-events:none}
.health-hero.grade-a::before,.health-hero.grade-b::before{background:radial-gradient(ellipse at 50% 0%,var(--green-bg) 0%,transparent 70%)}
.health-hero.grade-c::before{background:radial-gradient(ellipse at 50% 0%,var(--amber-bg) 0%,transparent 70%)}
.health-hero-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px;position:relative}
.health-hero-score{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:96px;line-height:1;letter-spacing:-.04em;color:var(--red);font-weight:400;margin-bottom:6px;position:relative}
.health-hero-score.success{color:var(--green)}
.health-hero-score.warning{color:var(--amber)}
.health-hero-score-denom{font-size:30px;color:var(--text-tertiary);letter-spacing:-.01em;font-style:italic}
.health-hero-grade{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:14px;position:relative}
.health-hero-grade.success{color:var(--green)}
.health-hero-grade.warning{color:var(--amber)}
.health-hero-framework{font-size:12px;color:var(--text-tertiary);font-family:'Instrument Serif',Georgia,serif;font-style:italic;max-width:340px;margin:0 auto;line-height:1.55;position:relative}
.health-hero-framework strong{color:var(--text-secondary);font-weight:600;font-style:normal;font-family:'Inter',sans-serif;font-size:12px}

.dim-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-xs);transition:box-shadow var(--t)}
.dim-card:hover{box-shadow:var(--shadow-sm)}
.dim-card.success{border-left-color:var(--green)}
.dim-card.warning{border-left-color:var(--amber)}
.dim-card.critical{border-left-color:var(--red)}
.dim-body-inner{padding:14px 14px 12px}
.dim-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.dim-title-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dim-name{font-size:14px;font-weight:600;color:var(--text-primary);letter-spacing:-.01em}
.dim-action-pill{font-size:9px;font-weight:600;padding:1px 7px;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;border:1px solid currentColor}
.dim-action-pill.healthy{color:var(--green);background:var(--green-bg)}
.dim-action-pill.needs-action{color:var(--red);background:var(--red-bg)}
.dim-action-pill.watch{color:var(--amber);background:var(--amber-bg)}

.dim-score-big{flex:0 0 auto;text-align:right;font-family:'Instrument Serif',Georgia,serif;font-style:italic;line-height:1}
.dim-score-big-num{font-size:32px;font-weight:400;letter-spacing:-.02em;color:var(--red)}
.dim-score-big-num.success{color:var(--green)}
.dim-score-big-num.warning{color:var(--amber)}
.dim-score-big-denom{font-size:14px;color:var(--text-tertiary);margin-left:1px}
.dim-score-big-weight{font-family:'Inter',sans-serif;font-style:normal;font-size:9px;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px;font-weight:500}

.dim-description{font-size:12px;color:var(--text-secondary);line-height:1.55;margin-bottom:12px}
.dim-bar-wrap{margin-bottom:12px}
.dim-bar{height:3px;background:var(--bg-tertiary);border-radius:99px;overflow:hidden}
.dim-bar-fill{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.3,.9,.3,1)}
.dim-bar-fill.success{background:var(--green)}
.dim-bar-fill.warning{background:var(--amber)}
.dim-bar-fill.critical{background:var(--red)}

.dim-row{display:flex;gap:12px;padding:5px 0;font-size:11px;align-items:baseline}
.dim-row-label{color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;font-size:9px;flex:0 0 92px;font-weight:600}
.dim-row-val{color:var(--text-secondary);flex:1;font-size:11px;line-height:1.5}
.dim-row-val.first-rain{color:var(--red);font-weight:600}
.dim-row-val.first-rain.success{color:var(--green)}
.dim-row-val.first-rain.warning{color:var(--amber)}
.dim-row-val.gap{color:var(--red);font-weight:500}
.dim-row-val.gap.success{color:var(--green)}
.dim-row-val.gap.warning{color:var(--amber)}
.dim-row-val.source{color:var(--text-muted);font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:11px;line-height:1.5}

/* ═══ TELEGRAM ═══ */
.telegram-banner{background:var(--bg-secondary);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r);padding:14px 16px;font-family:'Inter',monospace;font-size:12px;line-height:1.7;white-space:pre-wrap;color:var(--text-secondary);box-shadow:var(--shadow-xs)}

/* ═══ SOURCES ═══ */
.src-card{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px;box-shadow:var(--shadow-xs)}
.src-indicator{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px;box-shadow:0 0 0 3px var(--bg-secondary)}
.src-indicator.ok{background:var(--green)}
.src-indicator.stale{background:var(--amber)}
.src-indicator.err,.src-indicator.failed{background:var(--red)}
.src-text{flex:1;min-width:0}
.src-name{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:2px}
.src-detail{font-size:10px;color:var(--text-muted);line-height:1.4}
.src-ts{font-size:9px;color:var(--text-tertiary);margin-top:5px;display:flex;align-items:center;gap:5px}
.src-ts-badge{padding:1px 5px;border-radius:3px;font-weight:600;font-size:8.5px;letter-spacing:.03em;text-transform:uppercase}
.src-ts-badge.ok{background:rgba(52,199,89,.12);color:var(--green)}
.src-ts-badge.stale{background:rgba(255,149,0,.12);color:var(--amber)}
.src-ts-badge.failed{background:rgba(255,59,48,.12);color:var(--red)}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:150;backdrop-filter:blur(2px)}
.overlay.on{display:block}

/* ═══ MOBILE NAV ═══ */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:calc(var(--mobile-nav-h) + var(--safe-bottom));background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -2px 16px rgba(0,0,0,.06);z-index:300;padding:0 4px var(--safe-bottom)}
.mn-scroll{display:flex;overflow-x:auto;height:var(--mobile-nav-h);align-items:center;padding:0 4px;gap:0;scrollbar-width:none}
.mn-scroll::-webkit-scrollbar{display:none}
.mn-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;height:52px;border-radius:var(--r-sm);border:none;background:transparent;cursor:pointer;font-size:9px;font-weight:600;color:var(--text-muted);gap:3px;padding:4px 6px;transition:background var(--t),color var(--t);flex-shrink:0}
.mn-btn.on{color:var(--accent);background:var(--accent-light)}
.mn-icon{font-size:18px;line-height:1}

.tpl-warning{max-width:520px;margin:60px auto;padding:28px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.tpl-warning h1{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:26px;color:var(--text-primary);margin-bottom:12px;font-weight:400;letter-spacing:-.01em}
.tpl-warning p{color:var(--text-secondary);font-size:13px;line-height:1.6;margin-bottom:10px}
.tpl-warning code{background:var(--bg-secondary);padding:2px 6px;color:var(--accent);font-size:12px;border-radius:3px}
.tpl-warning ul{padding-left:20px;color:var(--text-secondary);font-size:12px;line-height:1.8}
.tpl-warning-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:12px}

/* ═══ RESPONSIVE ═══ */
@media(max-width:900px){
  .sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .tb-menu{display:flex !important}
  .tb-date{display:none}
  .page{padding:20px 16px 80px}
  .mobile-nav{display:flex}
  .hero-title{font-size:26px}
  .hero-amount{font-size:48px}
  .annual-value{font-size:44px}
  .health-hero-score{font-size:80px}
  .q-hero-grid{grid-template-columns:1fr 1fr;gap:12px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .ov-split{flex-direction:column;gap:16px}
  .ov-col{flex:none}
  .ov-col-hero .hero{height:auto;margin-bottom:0}
}
@media(max-width:480px){
  .page-title{font-size:26px}
}




/* ═══════════════════════════════════════════════════════════
   PROJECTS v7 · Strategic Scorecard with Visual Charts
   Fixes vs v6: dark mode theme tokens + mobile layout + font floors
═══════════════════════════════════════════════════════════ */

/* ═══ Theme-aware region colors (have dark-mode overrides) ═══ */
:root{
  --v7-region-india: var(--accent);
  --v7-region-europe: #7a5cb5;
  --v7-region-uk: #5c8db5;
  --v7-region-sea: #c98a3a;
  --v7-region-me: #b58860;
  --v7-region-americas: #4a9d6c;
  --v7-region-row: #8a8a80;
  --v7-panel-bg: #f5f1ea;       /* replaces var(--cream) in v6 */
  --v7-panel-bg-2: #ebe5da;     /* replaces var(--cream-2) */
  --v7-nested-bg: #efe9dd;      /* darker inner panel (TODAY/TARGET row) */
  --v7-chart-bg: #faf8f4;       /* trajectory chart inner bg */
}
[data-theme="dark"]{
  --v7-region-india: var(--accent);
  --v7-region-europe: #b48cdc;
  --v7-region-uk: #7eb0d8;
  --v7-region-sea: #e0a456;
  --v7-region-me: #d5a87f;
  --v7-region-americas: #6bc28c;
  --v7-region-row: #b0b0a8;
  --v7-panel-bg: #222220;
  --v7-panel-bg-2: #2a2a26;
  --v7-nested-bg: #252522;
  --v7-chart-bg: #1d1d1b;
}

.v7-section-title{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:19px;color:var(--text-primary);
  margin:32px 0 12px 0;letter-spacing:-.01em;
}
.v7-section-title em{color:var(--accent);font-style:italic}

/* ═══ HERO — trajectory chart ═══ */
.v7-hero{
  background:var(--v7-panel-bg);
  border:1px solid var(--accent-border);
  border-left:5px solid var(--accent);
  border-radius:var(--r-lg);
  padding:20px 22px;margin-bottom:24px;
  box-shadow:var(--shadow-sm);
}
.v7-hero-kicker{
  font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);margin-bottom:12px;
}
.v7-hero-headline{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;
  font-size:26px;line-height:1.3;color:var(--text-primary);letter-spacing:-.015em;
  margin-bottom:16px;
}
.v7-hero-headline em{color:var(--accent);font-style:italic}
.v7-hero-chart{
  background:var(--v7-chart-bg);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:14px 10px;margin-bottom:16px;
}
.v7-traj-svg{display:block;width:100%;height:auto;max-height:220px}
.v7-hero-frame{
  font-size:13px;line-height:1.6;color:var(--text-primary);
  padding:10px 0 0 14px;border-left:3px solid var(--accent);
}
.v7-hero-frame strong{color:var(--accent);font-weight:700}

/* ═══ FY27 INDICATORS — progress bars ═══ */
.v7-indicator-grid{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));gap:12px;
}
.v7-indicator{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:14px 16px;
  box-shadow:var(--shadow-xs);
  display:flex;flex-direction:column;gap:10px;
}
.v7-ind-on{border-left:4px solid var(--green)}
.v7-ind-gap{border-left:4px solid var(--amber)}
.v7-ind-risk{border-left:4px solid var(--red)}
.v7-ind-watch{border-left:4px solid var(--text-muted)}
.v7-ind-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.v7-ind-label{font-size:14px;font-weight:600;color:var(--text-primary)}
.v7-ind-status{
  font-size:10px;font-weight:700;letter-spacing:.08em;
  padding:4px 10px;border-radius:99px;white-space:nowrap;
}
.v7-ind-on .v7-ind-status{background:var(--green-bg);color:var(--green);border:1px solid var(--green)}
.v7-ind-gap .v7-ind-status{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber)}
.v7-ind-risk .v7-ind-status{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}
.v7-ind-watch .v7-ind-status{background:var(--v7-panel-bg-2);color:var(--text-muted);border:1px solid var(--border)}
.v7-pbar{display:block;width:100%;height:auto;max-height:42px}
.v7-ind-note{
  font-size:12px;line-height:1.55;color:var(--text-secondary);
}
.v7-ind-note strong{color:var(--text-primary);font-weight:600}

/* ═══ CONTEXT CARDS (donut + stacked bar) ═══ */
.v7-context-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:18px 22px;box-shadow:var(--shadow-xs);
  display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:center;
  margin-bottom:8px;
}
.v7-context-card-wide{
  grid-template-columns:1fr;
}
.v7-context-chart{display:flex;align-items:center;justify-content:center;min-width:0}
.v7-donut{display:block;width:100%;max-width:320px;height:auto}
.v7-context-text{display:flex;flex-direction:column;gap:10px;min-width:0}
.v7-context-h{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:20px;color:var(--text-primary);line-height:1.35;letter-spacing:-.01em;
}
.v7-context-b{
  font-size:12.5px;line-height:1.6;color:var(--text-secondary);
}
.v7-context-stat-row{
  display:flex;gap:16px;flex-wrap:wrap;
  padding-top:10px;border-top:1px dashed var(--border);
}
.v7-context-stat{display:flex;flex-direction:column;gap:1px}
.v7-cs-l{font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase}
.v7-cs-v{font-size:15px;font-weight:600;color:var(--text-primary);font-variant-numeric:tabular-nums}
.v7-stacked-wrap{padding:4px 0;overflow-x:auto}
.v7-stacked{display:block;width:100%;height:auto;min-width:500px}
.v7-stacked-summary{
  font-size:12px;color:var(--text-tertiary);font-style:italic;
  font-family:'Instrument Serif',Georgia,serif;text-align:center;margin-top:8px;
}
.v7-stacked-summary strong{color:var(--text-primary);font-weight:600;font-style:normal;font-family:Inter,sans-serif;font-variant-numeric:tabular-nums}

/* ═══ LEVER CARDS ═══ */
.v7-lever-grid{display:flex;flex-direction:column;gap:12px}
.v7-lever{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:18px 20px;box-shadow:var(--shadow-xs);
}
.v7-lever-priority{
  border:1px solid var(--accent-border);
  box-shadow:0 0 0 3px var(--accent-light), var(--shadow-sm);
}
.v7-lever-head{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.v7-lever-num{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:38px;line-height:1;color:var(--accent);
  width:36px;flex-shrink:0;text-align:center;
}
.v7-lever-title{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:22px;color:var(--text-primary);letter-spacing:-.01em;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:1;min-width:0;
}
.v7-lever-tag{
  font-family:Inter,sans-serif;font-style:normal;
  font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  background:var(--accent);color:#fff;
  padding:3px 9px;border-radius:99px;
}
.v7-lever-state{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
  padding:14px 16px;margin-bottom:10px;
  background:var(--v7-nested-bg);border-radius:var(--r);
}
.v7-state-cur, .v7-state-tgt{
  display:flex;flex-direction:column;gap:4px;
  padding-right:14px;border-right:1px dashed var(--border);
}
.v7-state-tgt{padding-right:0;border-right:0;padding-left:14px;border-left:1px dashed var(--border)}
.v7-state-l{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase}
.v7-state-v{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:28px;line-height:1.05;color:var(--text-primary);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.v7-state-tgt .v7-state-v{color:var(--accent)}
.v7-state-s{font-size:12px;color:var(--text-tertiary);font-style:italic;font-family:'Instrument Serif',Georgia,serif;line-height:1.4}

/* Mini progress bar inside lever */
.v7-lever-bar{
  display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:0 16px;
}
.v7-lever-bar svg{flex:1;height:10px}
.v7-lever-bar-l{
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums;
}

.v7-lever-bet{padding-top:4px}
.v7-bet-head{
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:10px;
}
.v7-bet-options{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));gap:10px;
}
.v7-bet-opt{
  background:var(--v7-nested-bg);border:1px solid var(--border);border-radius:var(--r);
  padding:12px 14px;
}
.v7-bet-opt-h{font-size:12.5px;font-weight:600;color:var(--text-primary);margin-bottom:4px}
.v7-bet-opt-b{font-size:12px;line-height:1.55;color:var(--text-secondary)}

.v7-lever-warning{
  margin-top:12px;padding:11px 14px;
  background:var(--amber-bg);border:1px solid var(--amber);border-radius:var(--r);
  font-size:12px;line-height:1.5;color:var(--text-primary);
  font-style:italic;font-family:'Instrument Serif',Georgia,serif;
}

/* ═══ ASSUMPTIONS ═══ */
.v7-wwhtbt{display:flex;flex-direction:column;gap:10px}
.v7-assume{
  display:flex;gap:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px 16px;box-shadow:var(--shadow-xs);
}
.v7-assume-num{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:32px;line-height:1;color:var(--accent);
  width:28px;flex-shrink:0;
  border-right:2px solid var(--accent-border);padding-right:12px;
}
.v7-assume-body{flex:1;min-width:0}
.v7-assume-h{font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:6px;line-height:1.35}
.v7-assume-t{font-size:12px;line-height:1.6;color:var(--text-secondary)}
.v7-assume-t strong{color:var(--text-primary);font-weight:600}

/* ═══ DEMOTED SUPPORTING DATA ═══ */
.v7-demote-header{
  margin-top:44px;padding-top:18px;
  border-top:1px solid var(--border);
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:14px;color:var(--text-tertiary);letter-spacing:.02em;
}
.v7-demote-header em{color:var(--text-muted);font-style:italic}
.v7-demote-note{
  font-size:12px;color:var(--text-muted);margin-bottom:16px;
  font-style:italic;font-family:'Instrument Serif',Georgia,serif;line-height:1.55;max-width:720px;
}
.v7-demote-block{margin-bottom:16px;opacity:0.85}
.v7-demote-block:hover{opacity:1;transition:opacity 0.2s ease}
.v7-demote-title{
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:8px;
}
.v7-muted{
  filter:saturate(0.85);
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.v7-muted .proj-table{font-size:11.5px;min-width:720px}
.v7-muted .proj-table th{font-size:9.5px;padding:8px 7px;color:var(--text-muted)}
.v7-muted .proj-table td{padding:7px;color:var(--text-secondary)}
.v7-muted .proj-code{font-size:10px}

/* ═══════════════════════════════════════════════════════════
   MOBILE RESPONSIVE (<640px)
═══════════════════════════════════════════════════════════ */
@media (max-width: 640px){
  /* Section titles */
  .v7-section-title{font-size:17px;margin:28px 0 10px 0}

  /* Hero */
  .v7-hero{padding:16px 16px;margin-bottom:20px}
  .v7-hero-headline{font-size:22px;line-height:1.3;margin-bottom:14px}
  .v7-hero-chart{padding:12px 6px}
  .v7-traj-svg{max-height:260px}
  .v7-hero-frame{font-size:12.5px;padding:10px 0 0 12px}

  /* Indicators */
  .v7-indicator-grid{grid-template-columns:1fr;gap:10px}
  .v7-indicator{padding:14px 14px}
  .v7-ind-label{font-size:13px}
  .v7-ind-note{font-size:12px;line-height:1.55}
  .v7-pbar{max-height:44px}

  /* Context cards — stack on mobile */
  .v7-context-card{
    grid-template-columns:1fr;
    gap:14px;
    padding:16px 16px;
  }
  .v7-donut{max-width:100%}
  .v7-context-h{font-size:18px}
  .v7-context-b{font-size:12.5px}

  /* Lever cards */
  .v7-lever{padding:16px 16px}
  .v7-lever-head{gap:12px;margin-bottom:12px}
  .v7-lever-num{font-size:32px;width:28px}
  .v7-lever-title{font-size:19px}
  .v7-lever-state{
    grid-template-columns:1fr;
    gap:12px;padding:14px 14px;
  }
  .v7-state-cur, .v7-state-tgt{
    padding:0;border:0;padding-bottom:12px;border-bottom:1px dashed var(--border);
  }
  .v7-state-tgt{padding-bottom:0;border-bottom:0;padding-top:12px;border-top:1px dashed var(--border)}
  .v7-state-v{font-size:26px}
  .v7-state-s{font-size:12px}
  .v7-bet-options{grid-template-columns:1fr;gap:10px}
  .v7-bet-opt{padding:12px 14px}
  .v7-bet-opt-h{font-size:13px}
  .v7-bet-opt-b{font-size:12.5px}
  .v7-lever-bar{padding:0 8px;margin-bottom:12px}
  .v7-lever-warning{font-size:12.5px;padding:12px 14px}

  /* Assumptions */
  .v7-assume{padding:14px 14px;gap:12px}
  .v7-assume-num{font-size:28px;width:24px;padding-right:10px}
  .v7-assume-h{font-size:13.5px}
  .v7-assume-t{font-size:12px}

  /* Demoted */
  .v7-demote-header{font-size:13px}
  .v7-demote-note{font-size:12px}
}



/* ═══════════════════════════════════════════════════════════
   PROJECTS v8 · Momentum + Enterprise Tracker + Compressed Levers
   (Extends v7 theme tokens — keep v7 CSS above)
═══════════════════════════════════════════════════════════ */

/* ═══ MOMENTUM SECTION ═══ */
.v8-mom-note{
  font-size:11px;color:var(--text-muted);font-style:italic;
  font-family:'Instrument Serif',Georgia,serif;margin-bottom:12px;
}
.v8-mom-note strong{
  font-style:normal;font-family:'SF Mono','Consolas',monospace;
  color:var(--accent);font-size:10.5px;
}

.v8-mom-grid{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(310px, 1fr));gap:12px;
  margin-bottom:16px;
}

.v8-mom-pod{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px 16px;box-shadow:var(--shadow-xs);
  display:flex;flex-direction:column;
}
.v8-mom-imminent{border-left:4px solid var(--accent)}
.v8-mom-slipping{border-left:4px solid var(--red)}
.v8-mom-funnel{border-left:4px solid var(--text-muted)}

.v8-mom-pod-head{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:10px;padding-bottom:10px;margin-bottom:10px;
  border-bottom:1px dashed var(--border);
}
.v8-mom-pod-title{
  font-size:13px;font-weight:600;color:var(--text-primary);
}
.v8-mom-pod-count{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:26px;line-height:1;color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.v8-mom-slipping .v8-mom-pod-count{color:var(--red)}
.v8-mom-funnel .v8-mom-pod-count{color:var(--text-secondary)}

.v8-mom-pod-body{flex:1;display:flex;flex-direction:column;gap:0}

/* Row item for imminent/slipping pods */
.v8-mom-row{
  display:flex;gap:10px;align-items:flex-start;
  padding:8px 0;border-top:1px dotted var(--border);
}
.v8-mom-row:first-child{border-top:0;padding-top:0}
.v8-mom-row-main{flex:1;min-width:0}
.v8-mom-row-name{
  font-size:12px;font-weight:600;color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:2px;
}
.v8-mom-row-meta{
  font-size:10px;color:var(--text-tertiary);line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.v8-mom-row-side{
  flex-shrink:0;text-align:right;min-width:78px;
}
.v8-mom-row-amt{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:14px;line-height:1;color:var(--text-primary);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  margin-bottom:3px;
}
.v8-mom-row-days{
  font-size:9px;font-weight:700;letter-spacing:.06em;
  padding:2px 7px;border-radius:99px;display:inline-block;
  font-variant-numeric:tabular-nums;
}
.v8-mom-row-days.urgent{background:var(--red-bg);color:var(--red)}
.v8-mom-row-days.overdue{background:var(--red);color:white}
.v8-mom-row-days.soon{background:var(--accent-light);color:var(--accent)}

.v8-mom-empty{
  font-size:11px;color:var(--text-tertiary);font-style:italic;
  font-family:'Instrument Serif',Georgia,serif;padding:10px 0;
}
.v8-mom-empty.v8-mom-clean{color:var(--green)}
.v8-mom-more{
  font-size:10px;color:var(--text-tertiary);font-style:italic;
  font-family:'Instrument Serif',Georgia,serif;padding-top:8px;
  border-top:1px dotted var(--border);margin-top:4px;
}

/* Funnel shape rows */
.v8-funnel-row{
  display:grid;grid-template-columns:110px 1fr 30px;gap:8px;
  align-items:center;padding:4px 0;font-size:11px;
}
.v8-funnel-label{
  color:var(--text-secondary);font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.v8-funnel-bar{height:6px;background:var(--v7-panel-bg-2);border-radius:99px;overflow:hidden}
.v8-funnel-fill{height:100%;border-radius:99px;background:var(--text-muted)}
.v8-funnel-fill.good{background:var(--green)}
.v8-funnel-fill.bad{background:var(--red)}
.v8-funnel-fill.mid{background:var(--accent)}
.v8-funnel-fill.mute{background:var(--text-muted);opacity:0.5}
.v8-funnel-count{
  text-align:right;font-variant-numeric:tabular-nums;
  font-weight:600;color:var(--text-primary);font-size:11px;
}

/* Recent wins strip */
.v8-wins-strip{
  background:var(--green-bg);border:1px solid var(--green-border);
  border-radius:var(--r);padding:12px 16px;margin-bottom:8px;
}
.v8-wins-head{
  font-size:11px;font-weight:700;letter-spacing:.08em;
  color:var(--green);margin-bottom:8px;
}
.v8-wins-list{display:flex;flex-wrap:wrap;gap:6px}
.v8-wins-pill{
  display:inline-flex;gap:8px;align-items:center;
  background:var(--surface);border:1px solid var(--green-border);
  padding:5px 10px;border-radius:99px;font-size:11px;
}
.v8-wins-client{color:var(--text-primary);font-weight:500}
.v8-wins-amt{
  color:var(--green);font-weight:600;font-variant-numeric:tabular-nums;
}

/* ═══ ENTERPRISE ACCOUNT TRACKER ═══ */
.v8-ent-summary{
  font-size:12px;color:var(--text-secondary);
  padding:8px 14px;background:var(--v7-panel-bg-2);border-radius:var(--r);
  border:1px solid var(--border);margin-bottom:14px;
}
.v8-ent-summary strong{color:var(--text-primary);font-weight:700;font-variant-numeric:tabular-nums}

.v8-ent-tier-label{
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-muted);margin:14px 0 8px 0;
}
.v8-ent-tier-label em{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  text-transform:none;letter-spacing:0;color:var(--text-tertiary);
  font-size:11px;font-weight:400;margin-left:6px;
}

.v8-acct-grid{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:8px;
  margin-bottom:8px;
}

.v8-acct-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:12px 14px;box-shadow:var(--shadow-xs);
}
.v8-tier-enterprise{border-left:4px solid var(--green)}
.v8-tier-radar{border-left:4px solid var(--accent)}
.v8-tier-target{border-left:4px solid var(--text-muted)}

.v8-acct-head{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.v8-acct-dot{font-size:14px;line-height:1;flex-shrink:0}
.v8-tier-enterprise .v8-acct-dot{color:var(--green)}
.v8-tier-radar .v8-acct-dot{color:var(--accent)}
.v8-tier-target .v8-acct-dot{color:var(--text-muted)}
.v8-acct-name{
  flex:1;font-size:13px;font-weight:600;color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.v8-acct-tier{
  font-size:8px;font-weight:700;letter-spacing:.1em;
  padding:2px 6px;border-radius:99px;flex-shrink:0;
  background:var(--v7-panel-bg-2);color:var(--text-muted);
  border:1px solid var(--border);
}
.v8-tier-enterprise .v8-acct-tier{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.v8-tier-radar .v8-acct-tier{background:var(--accent-light);color:var(--accent);border-color:var(--accent-border)}

.v8-acct-stats{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.v8-acct-stat{display:flex;flex-direction:column;gap:1px}
.v8-acct-sl{
  font-size:8px;font-weight:700;letter-spacing:.08em;
  color:var(--text-muted);text-transform:uppercase;
}
.v8-acct-sv{
  font-size:12px;font-weight:600;color:var(--text-primary);
  font-variant-numeric:tabular-nums;
}

/* ═══ COMPRESSED LEVER STRIP ═══ */
.v8-lever-strip{
  display:flex;flex-direction:column;gap:8px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px 16px;box-shadow:var(--shadow-xs);
}

.v8-lever-pill{
  display:grid;grid-template-columns:32px 1fr 54px;gap:12px;align-items:center;
  padding:10px 4px;border-bottom:1px dashed var(--border);
}
.v8-lever-pill:last-child{border-bottom:0}
.v8-lever-priority{
  background:var(--accent-light);margin:0 -10px;padding:10px 14px;
  border-radius:var(--r);border:1px solid var(--accent-border);
  border-bottom:1px solid var(--accent-border);
}

.v8-lever-pill-num{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:28px;line-height:1;color:var(--accent);text-align:center;
}
.v8-lever-pill-body{min-width:0}
.v8-lever-pill-title{
  font-size:13px;font-weight:600;color:var(--text-primary);
  line-height:1.3;margin-bottom:3px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.v8-lever-pill-tag{
  font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  background:var(--red);color:#fff;padding:2px 7px;border-radius:99px;
}
.v8-lever-pill-sub{
  font-size:10px;color:var(--text-tertiary);font-style:italic;
  font-family:'Instrument Serif',Georgia,serif;line-height:1.4;margin-bottom:6px;
  font-variant-numeric:tabular-nums;
}
.v8-lever-pill-bar{
  height:6px;background:var(--v7-panel-bg-2);border-radius:99px;overflow:hidden;
  border:1px solid var(--border);
}
.v8-lever-pill-bar-fill{height:100%;border-radius:99px;transition:width 0.3s ease}
.v8-lever-pill-pct{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:20px;line-height:1;text-align:right;
  color:var(--text-secondary);font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.v8-lever-priority .v8-lever-pill-pct{color:var(--red)}

.v8-lever-footnote{
  font-size:11px;color:var(--text-muted);
  font-family:'Instrument Serif',Georgia,serif;margin-top:8px;text-align:center;
}
.v8-lever-footnote em{color:var(--text-tertiary)}

/* ═══════════════════════════════════════════════════════════
   MOBILE RESPONSIVE (extends v7 mobile)
═══════════════════════════════════════════════════════════ */
@media (max-width: 640px){
  .v8-mom-grid{grid-template-columns:1fr;gap:10px}
  .v8-mom-pod{padding:12px 14px}
  .v8-mom-pod-title{font-size:13px}
  .v8-mom-pod-count{font-size:22px}
  .v8-mom-row-amt{font-size:13px}

  .v8-acct-grid{grid-template-columns:1fr;gap:8px}
  .v8-acct-card{padding:12px 14px}

  /* Lever strip — keep horizontal, just shrink */
  .v8-lever-pill{grid-template-columns:28px 1fr 44px;gap:10px;padding:10px 2px}
  .v8-lever-priority{margin:0 -6px;padding:10px 10px}
  .v8-lever-pill-num{font-size:24px}
  .v8-lever-pill-title{font-size:12.5px}
  .v8-lever-pill-sub{font-size:10px}
  .v8-lever-pill-pct{font-size:18px}

  .v8-funnel-row{grid-template-columns:100px 1fr 28px}
  .v8-funnel-label{font-size:10.5px}
  .v8-funnel-count{font-size:10.5px}
}



/* ═══════════════════════════════════════════════════════════
   PROJECTS v9 · Enterprise hunt list + industry gap map
   (Extends v7/v8 — keep existing CSS above)
═══════════════════════════════════════════════════════════ */

/* ═══ Empty state (current enterprise strip when 0) ═══ */
.v9-empty-state{
  display:flex;gap:18px;align-items:center;
  background:var(--v7-panel-bg);border:1px dashed var(--border);
  border-radius:var(--r-lg);padding:18px 22px;margin-bottom:8px;
}
.v9-empty-icon{
  font-size:32px;color:var(--text-muted);
  line-height:1;flex-shrink:0;opacity:0.6;
}
.v9-empty-body{flex:1;min-width:0}
.v9-empty-h{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:18px;color:var(--text-primary);margin-bottom:4px;letter-spacing:-.01em;
}
.v9-empty-t{font-size:12px;line-height:1.6;color:var(--text-secondary)}

/* ═══ Hunt list summary bar ═══ */
.v9-hunt-summary{
  display:flex;gap:16px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:12px 18px;margin-bottom:14px;box-shadow:var(--shadow-xs);
}
.v9-hunt-stat{
  display:flex;flex-direction:column;gap:1px;
  padding-right:18px;border-right:1px dashed var(--border);
}
.v9-hunt-stat:last-child{border-right:0;padding-right:0}
.v9-hunt-stat-n{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:22px;line-height:1;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.v9-hunt-stat-l{
  font-size:9px;font-weight:700;letter-spacing:.1em;
  color:var(--text-muted);text-transform:uppercase;
}

/* ═══ Hunt list industry block ═══ */
.v9-hunt-industry{
  margin-bottom:18px;
}
.v9-hunt-ind-head{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:10px;padding:0 4px 8px 4px;margin-bottom:8px;
  border-bottom:1px solid var(--border);
}
.v9-hunt-ind-name{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:16px;color:var(--text-primary);letter-spacing:-.01em;
}
.v9-hunt-ind-count{
  font-size:10px;font-weight:600;letter-spacing:.06em;
  color:var(--text-muted);text-transform:uppercase;
  font-variant-numeric:tabular-nums;
}

/* ═══ Hunt account card grid ═══ */
.v9-hunt-acct-grid{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));gap:8px;
}

.v9-hunt-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:10px 12px;box-shadow:var(--shadow-xs);
  transition:box-shadow 0.2s ease;
}
.v9-hunt-card:hover{box-shadow:var(--shadow-sm)}
.v9-tier-1{border-left:3px solid var(--accent)}
.v9-tier-2{border-left:3px solid var(--text-muted)}
.v9-has-activity{background:var(--green-bg)}
.v9-has-activity.v9-tier-1{border-left-color:var(--green)}
.v9-has-activity.v9-tier-2{border-left-color:var(--green)}

.v9-hunt-card-head{
  display:flex;align-items:center;gap:8px;margin-bottom:6px;
}
.v9-hunt-tier{
  font-size:9px;font-weight:700;letter-spacing:.1em;
  padding:2px 6px;border-radius:99px;flex-shrink:0;
  background:var(--v7-panel-bg-2);color:var(--text-muted);
  border:1px solid var(--border);
  font-variant-numeric:tabular-nums;
}
.v9-tier-1 .v9-hunt-tier{background:var(--accent-light);color:var(--accent);border-color:var(--accent-border)}
.v9-hunt-name{
  flex:1;font-size:12.5px;font-weight:600;color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.3;
}
.v9-hunt-activity{
  font-size:12px;color:var(--green);line-height:1;flex-shrink:0;
}
.v9-hunt-meta{
  display:flex;justify-content:space-between;gap:8px;
  font-size:10px;color:var(--text-tertiary);
}
.v9-hunt-show{
  font-style:italic;font-family:'Instrument Serif',Georgia,serif;
  color:var(--text-secondary);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;
}
.v9-hunt-status{
  font-weight:600;letter-spacing:.04em;
  color:var(--text-muted);font-size:9px;text-transform:uppercase;
  white-space:nowrap;flex-shrink:0;
}

/* ═══ Industry gap map ═══ */
.v9-gap-note{
  font-size:12px;line-height:1.55;color:var(--text-secondary);
  font-style:italic;font-family:'Instrument Serif',Georgia,serif;
  margin-bottom:12px;max-width:720px;
}
.v9-gap-grid{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));gap:6px;
  margin-bottom:8px;
}
.v9-gap-cell{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 12px 12px 12px;box-shadow:var(--shadow-xs);
  display:flex;flex-direction:column;gap:6px;min-height:78px;
}
.v9-gap-full{
  border-left:4px solid var(--green);
  background:linear-gradient(135deg, var(--green-bg) 0%, var(--surface) 50%);
}
.v9-gap-partial{
  border-left:4px solid var(--accent);
  background:linear-gradient(135deg, var(--accent-light) 0%, var(--surface) 50%);
}
.v9-gap-empty{
  border-left:4px solid var(--border-strong);
  background:var(--v7-panel-bg-2);opacity:0.65;
}
.v9-gap-count{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:22px;line-height:1;letter-spacing:-.01em;
  color:var(--text-primary);font-variant-numeric:tabular-nums;
}
.v9-gap-full .v9-gap-count{color:var(--green)}
.v9-gap-partial .v9-gap-count{color:var(--accent)}
.v9-gap-empty .v9-gap-count{
  color:var(--text-muted);font-size:10px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;font-family:Inter,sans-serif;
  font-style:normal;padding-top:4px;
}
.v9-gap-ind{
  font-size:10.5px;line-height:1.35;color:var(--text-secondary);
  font-weight:500;
}
.v9-gap-empty .v9-gap-ind{color:var(--text-muted)}

/* ═══ MOBILE RESPONSIVE ═══ */
@media (max-width: 640px){
  .v9-empty-state{flex-direction:column;gap:10px;padding:14px 16px;align-items:flex-start}
  .v9-empty-icon{font-size:24px}
  .v9-empty-h{font-size:16px}

  .v9-hunt-summary{padding:10px 14px;gap:12px}
  .v9-hunt-stat{padding-right:12px}
  .v9-hunt-stat-n{font-size:19px}

  .v9-hunt-ind-name{font-size:15px}
  .v9-hunt-ind-count{font-size:9.5px}
  .v9-hunt-acct-grid{grid-template-columns:1fr;gap:6px}
  .v9-hunt-card{padding:10px 12px}

  .v9-gap-grid{grid-template-columns:repeat(2, 1fr);gap:6px}
  .v9-gap-cell{min-height:66px;padding:10px 10px}
  .v9-gap-count{font-size:18px}
  .v9-gap-ind{font-size:9.5px}
}



/* ═══════════════════════════════════════════════════════════
   PROJECTS v10 · Deal Health + FY27 quarterly coverage
═══════════════════════════════════════════════════════════ */

/* ═══ QUARTERLY COVERAGE (inside FY27 Revenue indicator) ═══ */
.v10-qc-wrap{
  padding-top:10px;margin-top:4px;
  border-top:1px dashed var(--border);
}
.v10-qc-label{
  font-size:9px;font-weight:700;letter-spacing:.1em;
  color:var(--text-muted);text-transform:uppercase;margin-bottom:6px;
}
.v10-qc-row{
  display:grid;grid-template-columns:repeat(4, 1fr);gap:6px;
}
.v10-qc-cell{
  display:flex;flex-direction:column;gap:3px;
}
.v10-qc-q{
  font-size:9px;font-weight:700;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:.08em;
}
.v10-qc-bar{
  height:6px;background:var(--v7-panel-bg-2);border-radius:99px;
  border:1px solid var(--border);overflow:hidden;
}
.v10-qc-fill{height:100%;border-radius:99px;transition:width 0.3s ease}
.v10-qc-fill.good{background:var(--green)}
.v10-qc-fill.mid{background:var(--accent)}
.v10-qc-fill.low{background:var(--amber)}
.v10-qc-fill.empty{background:var(--red);width:3%!important}
.v10-qc-val{
  font-size:10px;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--text-secondary);
}

/* ═══ DEAL HEALTH SECTION ═══ */
.v10-dh-grid{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(310px, 1fr));gap:12px;
  margin-bottom:8px;
}

.v10-dh-pod{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px 16px;box-shadow:var(--shadow-xs);
  display:flex;flex-direction:column;
}
.v10-dh-conv{border-left:4px solid var(--accent)}
.v10-dh-stuck{border-left:4px solid var(--amber)}
.v10-dh-exec{border-left:4px solid var(--text-muted)}

.v10-dh-head{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:10px;margin-bottom:4px;
}
.v10-dh-title{font-size:13px;font-weight:600;color:var(--text-primary)}
.v10-dh-metric{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;
  font-size:26px;line-height:1;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.v10-dh-stuck .v10-dh-metric{color:var(--amber)}
.v10-dh-exec .v10-dh-metric{color:var(--text-secondary)}

.v10-dh-sub{
  font-size:11px;color:var(--text-tertiary);
  font-style:italic;font-family:'Instrument Serif',Georgia,serif;
  margin-bottom:10px;padding-bottom:10px;
  border-bottom:1px dashed var(--border);
}

.v10-dh-body{flex:1;display:flex;flex-direction:column;gap:6px}

.v10-dh-empty{
  font-size:12px;color:var(--text-tertiary);
  font-style:italic;font-family:'Instrument Serif',Georgia,serif;
  padding:10px 0;text-align:center;
}
.v10-dh-empty.v10-dh-clean{color:var(--green)}

.v10-dh-more{
  font-size:10px;color:var(--text-tertiary);font-style:italic;
  font-family:'Instrument Serif',Georgia,serif;
  padding-top:6px;border-top:1px dotted var(--border);margin-top:4px;
}

.v10-dh-footnote{
  margin-top:10px;padding-top:10px;
  border-top:1px dashed var(--border);
  font-size:10px;color:var(--text-muted);line-height:1.5;
  font-family:'Instrument Serif',Georgia,serif;
}
.v10-dh-footnote em{color:var(--text-muted)}
.v10-dh-footnote strong{
  font-style:normal;font-family:Inter,sans-serif;
  color:var(--text-primary);font-weight:600;
}

/* Funnel rows (conversion pod) */
.v10-funnel-row{
  display:grid;grid-template-columns:90px 1fr 28px;gap:8px;
  align-items:center;padding:3px 0;font-size:11px;
}
.v10-funnel-label{
  color:var(--text-secondary);font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;
}
.v10-funnel-bar-wrap{
  height:8px;background:var(--v7-panel-bg-2);border-radius:99px;
  border:1px solid var(--border);overflow:hidden;
}
.v10-funnel-bar-fill{
  height:100%;border-radius:99px;background:var(--accent);
  opacity:0.85;
}
.v10-funnel-count{
  text-align:right;font-variant-numeric:tabular-nums;
  font-weight:600;color:var(--text-primary);font-size:11px;
}

/* Stuck rows */
.v10-stuck-row{
  display:flex;gap:10px;align-items:flex-start;
  padding:7px 0;border-top:1px dotted var(--border);
}
.v10-stuck-row:first-child{border-top:0;padding-top:0}
.v10-stuck-main{flex:1;min-width:0}
.v10-stuck-name{
  font-size:12px;font-weight:600;color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:2px;
}
.v10-stuck-meta{
  font-size:10px;color:var(--text-tertiary);line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.v10-stuck-days{
  flex-shrink:0;
  font-size:10px;font-weight:700;letter-spacing:.04em;
  padding:3px 9px;border-radius:99px;
  background:var(--amber);color:white;
  font-variant-numeric:tabular-nums;align-self:flex-start;
}

/* Exec rows */
.v10-exec-row{
  display:flex;gap:10px;align-items:center;
  padding:7px 0;border-top:1px dotted var(--border);
}
.v10-exec-row:first-child{border-top:0;padding-top:0}
.v10-exec-tag{
  flex-shrink:0;width:32px;
  font-size:10px;font-weight:700;letter-spacing:.06em;
  padding:4px 0;border-radius:var(--r);
  background:var(--v7-panel-bg-2);color:var(--text-muted);
  text-align:center;border:1px solid var(--border);
  font-variant-numeric:tabular-nums;
}
.v10-exec-main{flex:1;min-width:0}
.v10-exec-name{
  font-size:12px;font-weight:600;color:var(--text-primary);
  margin-bottom:2px;
}
.v10-exec-stats{
  font-size:10.5px;color:var(--text-tertiary);
  font-variant-numeric:tabular-nums;line-height:1.4;
}

/* ═══ MOBILE RESPONSIVE ═══ */
@media (max-width: 640px){
